name: R15 production closeout final

on:
  push:
    branches: [docs/r15-production-closeout-final]
    paths: [.github/workflows/r15-closeout-final.yml]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/r15-production-closeout-final
          fetch-depth: 0
      - name: Record R15 production closeout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          release = Path('docs/release-polish-schedule.md')
          text = release.read_text()
          old = 'Status: **Step R15 VALIDATED / Tunnel image aspect-ratio symmetry / awaiting production verification**'
          new = 'Status: **Step R15 PASS / production verified / Tunnel image aspect-ratio symmetry**'
          if old not in text:
              raise SystemExit('R15 release current-state marker not found')
          text = text.replace(old, new, 1)
          closeout = '''\n\n### R15 production closeout\nStatus: **PASS / production verified**\n\n- focused pre-fix audit `34092347452`, artifact `10007298129`, established the orientation defect;\n- corrected validation `34092878700`, artifact `10007516829`, measured wide/square/tall center=0, top/bottom/left/right=8, corner=19 and passed full desktop/390px image + spatial regression;\n- clean PR #40 merged as `c1673dfc7d20f890fb9f38ad2dfced1d2dc82855`;\n- matching main build `34116997123` passed;\n- matching production smoke `34116997193` passed with the permanent wide/square/tall Tunnel symmetry regression enabled;\n- production artifact `10016690589`.\n'''
          if '### R15 production closeout' not in text:
              text += closeout
          release.write_text(text)

          schedule = Path('docs/explore-3d-schedule.md')
          text = schedule.read_text()
          text = text.replace(
              'Status: **architecture redefinition active / implementation not yet started**',
              'Status: **E1 ACTIVE / Scene / Observer / Vision architecture split**',
              1,
          )
          text = text.replace(
              '## Step E0 — Finish active image/release work\nStatus: **pending R15 closeout**',
              '## Step E0 — Finish active image/release work\nStatus: **PASS / R15 production verified**',
              1,
          )
          text = text.replace(
              'Finish the already-validated Tunnel image aspect-ratio correction and production verification before starting the new 3D architecture implementation.\n\nDo not broaden R15 into the Explore 3D rebuild.',
              'R15 is closed. PR #40 merged as `c1673dfc7d20f890fb9f38ad2dfced1d2dc82855`; main build `34116997123` and production smoke `34116997193` both passed, including the permanent Tunnel aspect-ratio regression.\n\nThe image/release blocker is cleared. New product work may proceed to E1 without broadening or reopening R15.',
              1,
          )
          text = text.replace(
              '## Step E1 — Architecture split: Scene / Observer / Vision\nStatus: **next**',
              '## Step E1 — Architecture split: Scene / Observer / Vision\nStatus: **ACTIVE**',
              1,
          )
          schedule.write_text(text)
          PY
      - name: Commit closeout docs
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add docs/release-polish-schedule.md docs/explore-3d-schedule.md
          git commit -m "Close R15 and activate Explore 3D E1"
          git push origin HEAD:docs/r15-production-closeout-final
