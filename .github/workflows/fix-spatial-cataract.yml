name: fix spatial cataract rendering

on:
  push:
    branches:
      - feat/spatial-pilot

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/spatial-pilot

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply cataract patch
        run: python scripts/patch_cataract.py

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit fix and remove temporary patch machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SpatialPage.tsx
          git rm .github/workflows/fix-spatial-cataract.yml scripts/patch_cataract.py
          git commit -m "Fix scene-dependent cataract rendering"
          git push
