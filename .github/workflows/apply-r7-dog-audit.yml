name: Apply R7 Dog-like image audit

on:
  push:
    branches:
      - feat/r7-dog-image-audit

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/r7-dog-image-audit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply Dog-like renderer revision
        run: python scripts/patch_r7_dog.py

      - name: Install app dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install temporary browser dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Dog-like output and full spatial regression
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/asseenby-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null
          node scripts/check_r7_dog.mjs
          node .github/spatial-browser-check.mjs

      - name: Upload Dog-like audit captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-dog-image-audit
          path: |
            dog-audit/
            browser-check/
          if-no-files-found: warn

      - name: Commit clean implementation
        if: success()
        run: |
          rm -f scripts/patch_r7_dog.py scripts/check_r7_dog.mjs .github/workflows/apply-r7-dog-audit.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Revise Dog-like image observer proxy"
          git push origin HEAD:feat/r7-dog-image-audit
