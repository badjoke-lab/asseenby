name: Rebuild Hansaplatz v10 landmark plaza

on:
  push:
    branches:
      - feat/hansaplatz-v10-landmark-plaza-20260911
    paths:
      - scripts/blender/author_hamburg_hansaplatz_landmark_plaza.py
      - .github/workflows/rebuild-hansaplatz-v10-landmark-plaza.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hansaplatz-v10-landmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out v10 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Blender
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender python3-numpy
          blender --version
          python3 -c 'import numpy; print(numpy.__version__)'

      - name: Verify Hamburg v9 base
        run: |
          set -euo pipefail
          test -s assets-src/blender/night-intersection/c0/night-intersection-c0.blend
          test -s public/assets/3d/night-intersection/c0/core/night-intersection-c0.glb
          test -s scripts/blender/author_hamburg_hansaplatz_landmark_plaza.py
          grep -q '^canonical_city_lock=Hamburg$' .github/HANSAPLATZ_SOURCE_TRUTH
          grep -q '^raw_equirectangular_wall_projection=forbidden$' .github/HANSAPLATZ_SOURCE_TRUTH

      - name: Author Hansabrunnen and central plaza layer
        run: |
          set -euo pipefail
          blender --background assets-src/blender/night-intersection/c0/night-intersection-c0.blend \
            --python-exit-code 1 \
            --python scripts/blender/author_hamburg_hansaplatz_landmark_plaza.py

      - name: Validate v10 source and geometry contract
        run: |
          set -euo pipefail
          blender --background assets-src/blender/night-intersection/c0/night-intersection-c0.blend \
            --python-exit-code 1 \
            --python-expr "import bpy; root=bpy.data.collections.get('C0'); assert root is not None; assert int(root.get('hamburg_hansaplatz_quality_version',0))==10; assert root.get('hamburg_hansaplatz_landmark_plaza') is True; assert root.get('hamburg_hansaplatz_photo_origin_runtime')=='0,0'; assert abs(float(root.get('hamburg_hansabrunnen_height_m',0))-17.0)<0.01; assert root.get('hamburg_hansabrunnen_runtime_position')=='-7.377,0,-30.192'; assert int(root.get('hamburg_linden_ring_tree_count',0))>=10; assert int(root.get('hamburg_v10_fountain_object_count',0))>=18; assert int(root.get('hamburg_v10_tree_object_count',0))>=40; assert int(root.get('hamburg_v10_paving_object_count',0))>=200; assert root.get('raw_panorama_wall_projection') is False; objs=[o for o in bpy.data.objects if o.name.startswith('hamburg_hansaplatz_v10_')]; assert len(objs)>=250,len(objs); print('V10_OBJECTS',len(objs)); print('FOUNTAIN',root.get('hamburg_hansabrunnen_runtime_position'),root.get('hamburg_hansabrunnen_height_m')); print('LINDENS',root.get('hamburg_linden_ring_tree_count')); print('PAVING',root.get('hamburg_v10_paving_object_count'))"

      - name: Export v10 C0 GLB
        run: |
          set -euo pipefail
          out=public/assets/3d/night-intersection/c0/core/night-intersection-c0.glb
          blender --background assets-src/blender/night-intersection/c0/night-intersection-c0.blend \
            --python-exit-code 1 \
            --python scripts/blender/export_night_intersection.py -- \
            --collection C0 \
            --out "$out"
          test -s "$out"
          sha256sum "$out" > public/assets/3d/night-intersection/c0/core/SHA256SUMS.txt
          cat > public/assets/3d/night-intersection/c0/core/BUILD.txt <<'EOF'
          Canonical location: Hansaplatz, Hamburg-St. Georg, Germany
          Photo reference origin: 53.554451, 10.012056 = runtime 0,0
          Macro geometry: Hamburg official 3D-Gebäudemodell LoD2-DE 2026
          Macro geometry provider: Freie und Hansestadt Hamburg, LGV
          LoD3 nearfield status: verified official coverage gap; no distant LoD3 substitution
          v9 facade layer: retained
          v10 landmark: Hansabrunnen reconstruction proxy at runtime -7.377,0,-30.192
          Hansabrunnen documented height: 17 m
          Hansabrunnen source: https://www.hamburg.de/tourismus/sehenswuerdigkeiten/hansaplatz-hamburg-360882
          v10 central paving: Granitkleinpflaster visual reconstruction; exact surveyed zone dimensions not claimed
          v10 tree ring: 12 mature linden visual proxies around fountain; exact surveyed tree positions not claimed
          Plaza design source: https://www.hamburg.de/contentblob/4498572/c9f8de8272cf87cba874c4af9de5f84b
          Photo reference: Poly Haven hansaplatz, CC0-1.0; environment/reference only
          Raw equirectangular wall projection: forbidden
          Runtime: Blender-authored C0 exported to GLB for Three.js
          EOF
          du -h assets-src/blender/night-intersection/c0/night-intersection-c0.blend "$out"
          cat public/assets/3d/night-intersection/c0/core/SHA256SUMS.txt

      - name: Validate repository build
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Upload v10 proof asset
        uses: actions/upload-artifact@v4
        with:
          name: hansaplatz-v10-landmark-${{ github.sha }}
          path: |
            assets-src/blender/night-intersection/c0/night-intersection-c0.blend
            public/assets/3d/night-intersection/c0/core/night-intersection-c0.glb
            public/assets/3d/night-intersection/c0/core/BUILD.txt
            public/assets/3d/night-intersection/c0/core/SHA256SUMS.txt
          retention-days: 7

      - name: Commit regenerated v10 C0
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets-src/blender/night-intersection/c0/night-intersection-c0.blend \
            public/assets/3d/night-intersection/c0/core/night-intersection-c0.glb \
            public/assets/3d/night-intersection/c0/core/BUILD.txt \
            public/assets/3d/night-intersection/c0/core/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'No generated v10 C0 changes'
            exit 0
          fi
          git commit -m 'Rebuild Hamburg C0 with Hansabrunnen and linden plaza'
          git reset --hard HEAD
          git clean -fd
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
