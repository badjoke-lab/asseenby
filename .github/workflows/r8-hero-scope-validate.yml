name: R8 hero scope validate

on:
  push:
    branches:
      - feat/r8-hero-current-scope

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Run R8-4 hero scope validation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/r8-hero-current-scope
          fetch-depth: 0
      - name: Apply R8-4 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          old = 'AsSeenBy is a research-based comparison viewer that translates commonly described visual differences into image-based approximations across human conditions, animal-inspired modes, and reference profiles.'
          new = 'AsSeenBy is a research-based comparison viewer that translates commonly described visual differences into image-based approximations across human visual conditions and animal-inspired modes.'
          if old not in app:
              raise SystemExit('hero scope sentence not found')
          app_path.write_text(app.replace(old, new, 1))

          smoke_path = Path('.github/production-smoke.mjs')
          smoke = smoke_path.read_text()
          needle = '  const pageText = await page.locator("body").innerText();'
          addition = needle + '\n  const heroText = await page.locator(".hero-copy").innerText();\n  assert(heroText.includes("human visual conditions") && heroText.includes("animal-inspired modes"), "desktop image: hero does not describe the current Human/Animal product scope");\n  assert(!heroText.includes("reference profiles"), "desktop image: removed Reference scope is still advertised in the hero");'
          if needle not in smoke:
              raise SystemExit('desktop hero smoke anchor not found')
          smoke_path.write_text(smoke.replace(needle, addition, 1))

          schedule_path = Path('docs/release-polish-schedule.md')
          schedule = schedule_path.read_text()
          schedule = schedule.replace(
              'Status: **Step R8 active / R8-2 production verified / R8-3 implementation**',
              'Status: **Step R8 active / R8-3 production verified / R8-4 implementation**',
              1,
          )
          schedule = schedule.replace(
              '### R8-3 — Desktop image workspace flow after Reference removal\nStatus: **ACTIVE — implementation**',
              '### R8-3 — Desktop image workspace flow after Reference removal\nStatus: **PASS / production verified**',
              1,
          )
          old_tail = '## Current next action\nRun build + full desktop/390px image/spatial browser smoke, inspect captures, then open a clean R8-3 PR only if the workspace flow is improved without mobile regression.'
          new_tail = '''Validation:
- build + full local desktop/390px image/spatial browser smoke `34043401959` — **success**;
- local artifact `9992371942` manually reviewed: desktop dead space removed, Human/Animal fill the primary column, and mobile order remained Compare -> controls/evidence -> Human -> Animal;
- PR #24 build `34043538817` — **success**;
- merge SHA `e21ef48e76357686c6a33e0e8de87e03629e6102`;
- matching main build `34043567332` — **success**;
- production smoke `34043567336` — **success on attempt 1**;
- production artifact `9992424231` manually reviewed with the same desktop/mobile layout result.

### R8-4 — Hero scope after Reference removal
Status: **ACTIVE — implementation**

Finding:
- the public Hero still says AsSeenBy covers `reference profiles` even though R7-9 removed Age Profile and the entire public Reference category;
- the live category selector and cards expose only Human and Animal, so the top-level product description is stale.

Implementation:
- change the Hero description to the current public scope: human visual conditions and animal-inspired modes;
- add a production-smoke assertion that the Hero contains the current Human/Animal scope and no longer advertises `reference profiles`.

Acceptance:
- Hero text matches the current two-category public product;
- `reference profiles` is absent from the public Hero;
- the Human/Animal category and exact audited mode sets remain unchanged;
- desktop/390px image and spatial regression remain green with no overflow or page/console errors;
- production screenshot review is required after merge before R8-4 is marked PASS.

## Current next action
Run the full browser regression against the R8-4 branch, inspect the Hero in desktop/mobile captures, then open a clean PR only if the current-scope wording is correct.'''
          if old_tail not in schedule:
              raise SystemExit('R8-3 schedule tail not found')
          schedule_path.write_text(schedule.replace(old_tail, new_tail, 1))
          PY
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full local browser smoke
        shell: bash
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 > /tmp/asseenby-r8-4-preview.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.5
          done
          ASSEENBY_PRODUCTION_URL=http://127.0.0.1:4173 node .github/production-smoke.mjs
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx .github/production-smoke.mjs docs/release-polish-schedule.md
          git commit -m 'Align hero with current public scope'
          git push
      - name: Upload browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-hero-scope-smoke
          path: production-smoke
