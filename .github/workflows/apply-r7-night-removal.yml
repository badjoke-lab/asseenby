name: Apply R7 Night image removal

on:
  push:
    branches:
      - feat/r7-night-image-audit

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/r7-night-image-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply removal patch
        run: python .github/r7-night-removal.py

      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium

      - name: Run browser regression
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/asseenby-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node .github/r7-night-removal-check.mjs

      - name: Commit clean implementation
        shell: bash
        run: |
          rm .github/workflows/apply-r7-night-removal.yml
          rm .github/r7-night-removal.py
          rm .github/r7-night-removal-check.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Remove unsupported Night image mode"
          git push origin HEAD:feat/r7-night-image-audit
