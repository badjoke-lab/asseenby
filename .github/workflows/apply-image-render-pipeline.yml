name: apply image render pipeline

on:
  push:
    branches:
      - feat/image-render-pipeline
    paths:
      - .github/workflows/apply-image-render-pipeline.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/image-render-pipeline

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply image render pipeline optimization
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()

          old = '''  const [strength, setStrength] = useState(65);\n  const [compareMode, setCompareMode] = useState<CompareMode>("slider");\n  const [divider, setDivider] = useState(52);\n  const [imageSrc, setImageSrc] = useState<string>(SAMPLE_IMAGE);\n  const [originalUrl, setOriginalUrl] = useState<string>(SAMPLE_IMAGE);\n  const [transformedUrl, setTransformedUrl] = useState<string>(SAMPLE_IMAGE);\n  const [isBusy, setIsBusy] = useState(false);\n  const [error, setError] = useState<string>("");\n  const fileInputRef = useRef<HTMLInputElement | null>(null);\n'''
          new = '''  const [strength, setStrength] = useState(65);\n  const [renderStrength, setRenderStrength] = useState(65);\n  const [compareMode, setCompareMode] = useState<CompareMode>("slider");\n  const [divider, setDivider] = useState(52);\n  const [imageSrc, setImageSrc] = useState<string>(SAMPLE_IMAGE);\n  const [originalUrl, setOriginalUrl] = useState<string>(SAMPLE_IMAGE);\n  const [transformedUrl, setTransformedUrl] = useState<string>(SAMPLE_IMAGE);\n  const [isBusy, setIsBusy] = useState(false);\n  const [error, setError] = useState<string>("");\n  const fileInputRef = useRef<HTMLInputElement | null>(null);\n  const baseCanvasRef = useRef<{ source: string; canvas: HTMLCanvasElement } | null>(null);\n  const transformedObjectUrlRef = useRef<string | null>(null);\n  const uploadedObjectUrlRef = useRef<string | null>(null);\n'''
          if old not in text:
              raise SystemExit('state anchor missing')
          text = text.replace(old, new, 1)

          old = '''  useEffect(() => {\n    let cancelled = false;\n    const run = async () => {\n      setIsBusy(true);\n      setError("");\n      try {\n        const result = await prepareImages(imageSrc, modeKey, strength / 100);\n        if (cancelled) return;\n        setOriginalUrl(result.originalUrl);\n        setTransformedUrl(result.transformedUrl);\n      } catch (err) {\n        if (cancelled) return;\n        setError(err instanceof Error ? err.message : "Failed to render image.");\n      } finally {\n        if (!cancelled) setIsBusy(false);\n      }\n    };\n    run();\n    return () => {\n      cancelled = true;\n    };\n  }, [imageSrc, modeKey, strength]);\n'''
          new = '''  useEffect(() => {\n    const timer = window.setTimeout(() => setRenderStrength(strength), 90);\n    return () => window.clearTimeout(timer);\n  }, [strength]);\n\n  useEffect(() => {\n    let cancelled = false;\n    let pendingObjectUrl: string | null = null;\n\n    const run = async () => {\n      setIsBusy(true);\n      setError("");\n      setOriginalUrl(imageSrc);\n      try {\n        let prepared = baseCanvasRef.current;\n        if (!prepared || prepared.source !== imageSrc) {\n          prepared = await prepareBaseCanvas(imageSrc);\n          if (cancelled) return;\n          baseCanvasRef.current = prepared;\n        }\n\n        const transformedCanvas = document.createElement("canvas");\n        transformedCanvas.width = prepared.canvas.width;\n        transformedCanvas.height = prepared.canvas.height;\n        applyImageTransform(prepared.canvas, transformedCanvas, modeKey, renderStrength / 100);\n        pendingObjectUrl = await canvasToObjectUrl(transformedCanvas, "image/jpeg", 0.94);\n\n        if (cancelled) {\n          URL.revokeObjectURL(pendingObjectUrl);\n          return;\n        }\n\n        if (transformedObjectUrlRef.current) {\n          URL.revokeObjectURL(transformedObjectUrlRef.current);\n        }\n        transformedObjectUrlRef.current = pendingObjectUrl;\n        setTransformedUrl(pendingObjectUrl);\n        pendingObjectUrl = null;\n      } catch (err) {\n        if (pendingObjectUrl) URL.revokeObjectURL(pendingObjectUrl);\n        if (cancelled) return;\n        setError(err instanceof Error ? err.message : "Failed to render image.");\n      } finally {\n        if (!cancelled) setIsBusy(false);\n      }\n    };\n\n    run();\n    return () => {\n      cancelled = true;\n    };\n  }, [imageSrc, modeKey, renderStrength]);\n\n  useEffect(() => {\n    return () => {\n      if (transformedObjectUrlRef.current) URL.revokeObjectURL(transformedObjectUrlRef.current);\n      if (uploadedObjectUrlRef.current) URL.revokeObjectURL(uploadedObjectUrlRef.current);\n    };\n  }, []);\n'''
          if old not in text:
              raise SystemExit('render effect anchor missing')
          text = text.replace(old, new, 1)

          old = '''              onUploadClick={() => fileInputRef.current?.click()}\n              onUseSample={() => setImageSrc(SAMPLE_IMAGE)}\n'''
          new = '''              onUploadClick={() => fileInputRef.current?.click()}\n              onUseSample={() => {\n                if (uploadedObjectUrlRef.current) {\n                  URL.revokeObjectURL(uploadedObjectUrlRef.current);\n                  uploadedObjectUrlRef.current = null;\n                }\n                baseCanvasRef.current = null;\n                setImageSrc(SAMPLE_IMAGE);\n              }}\n'''
          if old not in text:
              raise SystemExit('sample handler anchor missing')
          text = text.replace(old, new, 1)

          old = '''        onChange={(event) => {\n          const file = event.target.files?.[0];\n          if (!file) return;\n          const reader = new FileReader();\n          reader.onload = () => {\n            if (typeof reader.result === "string") setImageSrc(reader.result);\n          };\n          reader.readAsDataURL(file);\n          event.currentTarget.value = "";\n        }}\n'''
          new = '''        onChange={(event) => {\n          const file = event.target.files?.[0];\n          if (!file) return;\n          const nextUrl = URL.createObjectURL(file);\n          if (uploadedObjectUrlRef.current) URL.revokeObjectURL(uploadedObjectUrlRef.current);\n          uploadedObjectUrlRef.current = nextUrl;\n          baseCanvasRef.current = null;\n          setImageSrc(nextUrl);\n          event.currentTarget.value = "";\n        }}\n'''
          if old not in text:
              raise SystemExit('upload handler anchor missing')
          text = text.replace(old, new, 1)

          start = text.index('async function prepareImages(')
          end = text.index('function fitWithin(', start)
          replacement = '''async function prepareBaseCanvas(source: string) {\n  const image = await loadImage(source);\n  const { width, height } = fitWithin(image.width, image.height, 1400, 960);\n  const canvas = document.createElement("canvas");\n  canvas.width = width;\n  canvas.height = height;\n  const ctx = canvas.getContext("2d");\n  if (!ctx) throw new Error("Canvas is not available.");\n  ctx.drawImage(image, 0, 0, width, height);\n  return { source, canvas };\n}\n\nfunction canvasToObjectUrl(canvas: HTMLCanvasElement, type: string, quality: number) {\n  return new Promise<string>((resolve, reject) => {\n    canvas.toBlob((blob) => {\n      if (!blob) {\n        reject(new Error("Rendered image could not be encoded."));\n        return;\n      }\n      resolve(URL.createObjectURL(blob));\n    }, type, quality);\n  });\n}\n\n'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install temporary browser dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify image pipeline and full browser regression
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/asseenby-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null
          node .github/spatial-browser-check.mjs
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });

          const original = page.locator('img[alt="Original"]').first();
          const approximation = page.locator('img[alt="Approximation"]').first();
          await page.waitForFunction(() => document.querySelector('img[alt="Approximation"]')?.getAttribute('src')?.startsWith('blob:'));

          const originalBefore = await original.getAttribute('src');
          const transformedBefore = await approximation.getAttribute('src');
          if (!transformedBefore?.startsWith('blob:')) throw new Error('Transformed image is not using a blob URL');

          await page.evaluate(() => {
            const image = document.querySelector('img[alt="Approximation"]');
            if (!image) throw new Error('Approximation image missing');
            window.__approximationMutations = 0;
            const observer = new MutationObserver((records) => {
              for (const record of records) {
                if (record.type === 'attributes' && record.attributeName === 'src') window.__approximationMutations += 1;
              }
            });
            observer.observe(image, { attributes: true });
            window.__approximationObserver = observer;
          });

          const strength = page.getByLabel('Strength');
          for (const value of [20, 28, 36, 44, 52, 60, 68, 76, 84]) {
            await strength.fill(String(value));
            await page.waitForTimeout(15);
          }
          await page.waitForTimeout(260);

          const mutationCount = await page.evaluate(() => {
            window.__approximationObserver?.disconnect();
            return window.__approximationMutations;
          });
          if (mutationCount > 2) throw new Error(`Rapid strength drag caused ${mutationCount} rendered-image replacements`);

          const originalAfter = await original.getAttribute('src');
          const transformedAfter = await approximation.getAttribute('src');
          if (originalAfter !== originalBefore) throw new Error('Strength changes replaced the original image URL');
          if (!transformedAfter?.startsWith('blob:') || transformedAfter === transformedBefore) throw new Error('Strength change did not produce a new blob render');

          const fileInput = page.locator('input[type="file"]');
          await fileInput.setInputFiles({
            name: 'pipeline-test.svg',
            mimeType: 'image/svg+xml',
            buffer: Buffer.from('<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80"><rect width="120" height="80" fill="red"/></svg>'),
          });
          await page.waitForFunction(() => document.querySelector('img[alt="Original"]')?.getAttribute('src')?.startsWith('blob:'));
          const uploadOriginal = await original.getAttribute('src');
          if (!uploadOriginal?.startsWith('blob:')) throw new Error('Uploaded original is not using a blob URL');
          await page.waitForFunction(() => document.querySelector('img[alt="Approximation"]')?.getAttribute('src')?.startsWith('blob:'));

          await browser.close();
          NODE

      - name: Commit implementation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-image-render-pipeline.yml
          git add src/App.tsx
          git commit -m "Optimize image render pipeline"
          git push
