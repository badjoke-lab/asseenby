name: Repair Hansaplatz Day Night switch

on:
  push:
    branches:
      - feat/hansaplatz-v11-paving-canopy-20260911
    paths:
      - .github/fix_hansaplatz_day_night_switch.py
      - .github/workflows/fix-hansaplatz-day-night-switch-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply switch repair
        run: python3 .github/fix_hansaplatz_day_night_switch.py

      - name: Validate build
        run: |
          npm ci
          npm run build

      - name: Commit repaired source and proof
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/SpatialPage.tsx .github/hansaplatz-lod2-visual-proof.mjs
          if git diff --cached --quiet; then
            echo 'No repair changes'
            exit 0
          fi
          git commit -m 'Fix Hansaplatz Day Night switch rendering'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"