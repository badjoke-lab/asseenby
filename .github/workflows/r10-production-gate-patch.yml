name: Patch R10 production release gate

on:
  push:
    branches:
      - fix/r10-production-release-gate
    paths:
      - .github/workflows/r10-production-gate-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r10-production-release-gate
          fetch-depth: 0

      - name: Patch deployment detection
        run: python3 scripts/r10_production_gate_patch.py

      - name: Validate smoke syntax
        run: node --check .github/production-smoke.mjs

      - name: Commit clean gate fix
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git rm .github/workflows/r10-production-gate-patch.yml scripts/r10_production_gate_patch.py
          git add .github/production-smoke.mjs
          git diff --cached --check
          git commit -m "Harden production release detection for R10"
          git push origin HEAD:fix/r10-production-release-gate
