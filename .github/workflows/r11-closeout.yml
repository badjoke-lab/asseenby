name: R11 production closeout

on:
  push:
    branches:
      - docs/r11-production-closeout
    paths:
      - .github/workflows/r11-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/r11-production-closeout
          fetch-depth: 0

      - name: Apply R11 schedule closeout
        run: python3 scripts/r11_closeout.py

      - name: Commit schedule closeout
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add docs/release-polish-schedule.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No R11 closeout changes'; exit 1; }
          git commit -m "Close R11 after production verification"
          git push origin HEAD:docs/r11-production-closeout
