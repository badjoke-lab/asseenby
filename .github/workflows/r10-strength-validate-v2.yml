name: R10 Strength semantics validation v2

on:
  push:
    branches:
      - fix/r10-strength-semantics
    paths:
      - .github/workflows/r10-strength-validate-v2.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r10-strength-semantics
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply R10 product patch
        run: python3 scripts/r10_patch.py

      - name: Build
        run: npm run build

      - name: Install browser audit runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate 0/1/40/70/100 output curves
        shell: bash
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 > /tmp/r10-preview.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.5
          done
          node scripts/r10_strength_audit.mjs

      - name: Run full local browser regression
        shell: bash
        env:
          ASSEENBY_PRODUCTION_URL: http://127.0.0.1:4173
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 > /tmp/r10-smoke-preview.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.5
          done
          node .github/production-smoke.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r10-strength-validation-v2
          path: |
            r10-strength-audit.json
            production-smoke/
          if-no-files-found: warn

      - name: Commit validated R10 product changes
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add src/App.tsx src/transformEngine.ts .github/production-smoke.mjs docs/methodology.md docs/limitations.md docs/release-polish-schedule.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No R10 product changes to commit'; exit 1; }
          git commit -m "Fix image Strength semantics"
          git push origin HEAD:fix/r10-strength-semantics
