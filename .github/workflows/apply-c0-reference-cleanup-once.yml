name: Apply C0 reference foreground cleanup once

on:
  push:
    branches:
      - 'feat/c0-remove-placeholder-foreground-*'
    paths:
      - '.github/workflows/apply-c0-reference-cleanup-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Remove non-reference foreground placeholders before LoD2 import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/blender/apply_berlin_lod2_hansaplatz.py')
          text = path.read_text()
          old_doc = '''Runs after reconstruct_hansaplatz_c0.py. The plaza paving, canopies, subway entry\nand authored street props remain, while all hand-guessed building/pavilion masses\nare deleted and replaced with the local OBJ generated from Berlin's official LoD2.\n'''
          new_doc = '''Runs after reconstruct_hansaplatz_c0.py. Only the reference-matched scanned plaza\npaving is retained from the provisional foreground pass. Approximate canopy, kiosk,\nsubway, planter, generic-intersection props and QR2 blockout detail are removed\nbefore official Berlin LoD2 geometry is imported. This enforces a hard quality\nfloor: unknown foreground geometry stays absent until a reference-matched authored\nasset replaces it, rather than shipping a visibly wrong placeholder.\n'''
          if text.count(old_doc) != 1:
              raise SystemExit('unexpected apply_berlin docstring shape')
          text = text.replace(old_doc, new_doc)

          old = '''def remove_guessed_buildings() -> int:\n    prefixes = (\n        "hansaplatz_north_retail",\n        "hansaplatz_east_retail",\n        "hansaplatz_south_retail",\n        "hansaplatz_west_retail",\n        "hansaplatz_grips_theatre",\n        "hansaplatz_north_perimeter",\n        "hansaplatz_northwest_perimeter",\n        "lod2_",\n    )\n    doomed = [obj for obj in list(bpy.data.objects) if obj.name.startswith(prefixes)]\n    for obj in doomed:\n        bpy.data.objects.remove(obj, do_unlink=True)\n    return len(doomed)\n'''
          new = '''def remove_guessed_buildings() -> int:\n    # Keep only the scanned Hansaplatz paving from the provisional reconstruction.\n    # Everything else listed here was authored for the earlier invented intersection\n    # or is an approximate reference blockout that visibly conflicts with the real\n    # panorama. Missing real geometry is preferable to shipping false geometry.\n    generic_prefixes = (\n        "c0_authored_",\n        "c0_bench_",\n        "c0_tree_",\n        "c0_bollard_",\n        "c0_utility_",\n        "c0_trash_",\n        "c0_bike_",\n        "c0_signal_",\n        "c0_delivery_",\n        "c0_store_",\n        "c0_qr2_",\n        "lod2_",\n    )\n    doomed = [\n        obj\n        for obj in list(bpy.data.objects)\n        if obj.name.startswith(generic_prefixes)\n        or (\n            obj.name.startswith("hansaplatz_")\n            and not obj.name.startswith("hansaplatz_paving_slab_")\n        )\n    ]\n    for obj in doomed:\n        bpy.data.objects.remove(obj, do_unlink=True)\n    return len(doomed)\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected remove_guessed_buildings implementation')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit cleanup and remove bootstrap workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-c0-reference-cleanup-once.yml
          git add scripts/blender/apply_berlin_lod2_hansaplatz.py .github/workflows/apply-c0-reference-cleanup-once.yml
          git commit -m 'Remove mismatched C0 foreground placeholders'
          git push origin HEAD:"${GITHUB_REF_NAME}"
