name: apply spatial panorama v5

on:
  push:
    branches:
      - feat/spatial-central-loss
    paths:
      - .github/workflows/apply-spatial-panorama-v5.yml
      - scripts/upgrade_spatial_scene_v5.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/spatial-central-loss

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Add CC0 360 night panorama
        run: |
          mkdir -p public/assets/panoramas
          curl --fail --location --retry 3 \
            'https://dl.polyhaven.org/file/ph-assets/HDRIs/extra/Tonemapped%20JPG/hansaplatz.jpg' \
            -o public/assets/panoramas/hansaplatz.jpg
          cat > public/assets/panoramas/README.txt <<'EOF'
          Hansaplatz 360 HDRI, tonemapped JPG
          Source: Poly Haven — https://polyhaven.com/a/hansaplatz
          Author: Greg Zaal
          License: CC0 1.0 Universal
          Purpose in AsSeenBy: photographic spatial reference stimulus for fixed-viewpoint 360-degree perception comparisons.
          EOF

      - name: Apply panorama-backed scene patch
        run: python scripts/upgrade_spatial_scene_v5.py

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit panorama scene and remove temporary patch machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/SpatialPage.tsx public/assets/panoramas/hansaplatz.jpg public/assets/panoramas/README.txt
          git rm .github/workflows/apply-spatial-panorama-v5.yml scripts/upgrade_spatial_scene_v5.py
          git commit -m 'Replace primitive spatial street with CC0 360 photo reference'
          git push origin HEAD:feat/spatial-central-loss
