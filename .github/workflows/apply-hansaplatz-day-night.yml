name: Apply Hansaplatz Day Night split

on:
  push:
    branches:
      - feat/hansaplatz-v11-paving-canopy-20260911
    paths:
      - .github/apply_hansaplatz_day_night.py
      - .github/workflows/apply-hansaplatz-day-night.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hansaplatz-day-night-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply Day Night migration
        run: |
          set -euo pipefail
          python3 .github/apply_hansaplatz_day_night.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/SpatialPage.tsx')
          s = p.read_text()
          redundant = '      activeSceneRuntime?.setLightingMode(currentLightingMode);\n'
          if s.count(redundant) != 1:
              raise SystemExit(f'expected one redundant lighting call, got {s.count(redundant)}')
          p.write_text(s.replace(redundant, '', 1))
          PY
          # GitHub Actions GITHUB_TOKEN cannot push workflow-file mutations.
          # The visual workflow branch rule is updated separately through the
          # repository connector after the generated source commit lands.
          git checkout -- .github/workflows/verify-hansaplatz-lod2-visual.yml

      - name: Validate architecture markers
        run: |
          set -euo pipefail
          grep -q 'SPATIAL_LIGHTING_MODES' src/spatial/catalog.ts
          grep -q 'id: "day"' src/spatial/catalog.ts
          grep -q 'id: "night"' src/spatial/catalog.ts
          grep -q 'setLightingMode' src/spatial/sceneRuntime.ts
          grep -q 'spatial-lighting-select' src/SpatialPage.tsx
          grep -q 'useState<SpatialLightingMode>("day")' src/SpatialPage.tsx
          grep -q 'desktop-night-forward.png' .github/hansaplatz-lod2-visual-proof.mjs

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit Day Night implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/spatial/catalog.ts src/spatial/sceneRuntime.ts src/SpatialPage.tsx src/spatial.css .github/hansaplatz-lod2-visual-proof.mjs docs/explore-3d-spec.md docs/roadmap.md
          if git diff --cached --quiet; then
            echo 'No migration changes'
            exit 0
          fi
          git commit -m 'Make Hansaplatz Day the default 3D baseline'
          git reset --hard HEAD
          git clean -fd
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"