name: Apply Hansaplatz Day Night split

on:
  push:
    branches:
      - feat/hansaplatz-v11-paving-canopy-20260911
    paths:
      - .github/apply_hansaplatz_day_night.py
      - .github/workflows/apply-hansaplatz-day-night.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hansaplatz-day-night-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply Day Night migration
        run: python3 .github/apply_hansaplatz_day_night.py

      - name: Validate architecture markers
        run: |
          set -euo pipefail
          grep -q 'SPATIAL_LIGHTING_MODES' src/spatial/catalog.ts
          grep -q 'id: "day"' src/spatial/catalog.ts
          grep -q 'id: "night"' src/spatial/catalog.ts
          grep -q 'setLightingMode' src/spatial/sceneRuntime.ts
          grep -q 'spatial-lighting-select' src/SpatialPage.tsx
          grep -q 'useState<SpatialLightingMode>("day")' src/SpatialPage.tsx
          grep -q 'desktop-night-forward.png' .github/hansaplatz-lod2-visual-proof.mjs

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit Day Night implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/spatial/catalog.ts src/spatial/sceneRuntime.ts src/SpatialPage.tsx src/spatial.css .github/hansaplatz-lod2-visual-proof.mjs .github/workflows/verify-hansaplatz-lod2-visual.yml docs/explore-3d-spec.md docs/roadmap.md
          if git diff --cached --quiet; then
            echo 'No migration changes'
            exit 0
          fi
          git commit -m 'Make Hansaplatz Day the default 3D baseline'
          git reset --hard HEAD
          git clean -fd
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
