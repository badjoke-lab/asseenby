name: Apply C0 contact shadow depth once

on:
  push:
    branches:
      - 'feat/c0-contact-shadow-depth-*'
    paths:
      - '.github/workflows/apply-c0-shadow-depth-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out quality branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply restrained night lighting and authored contact shadows
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/SpatialPage.tsx'): [
                  ('renderer.shadowMap.enabled = false;', 'renderer.shadowMap.enabled = true;'),
              ],
              Path('src/spatial/nightIntersectionScene.ts'): [
                  ('new THREE.HemisphereLight(0xa8bad0, 0x3d3024, 2.15)', 'new THREE.HemisphereLight(0xa8bad0, 0x3d3024, 0.95)'),
                  ('new THREE.AmbientLight(0x8f9baa, 0.72)', 'new THREE.AmbientLight(0x8f9baa, 0.22)'),
                  ('new THREE.DirectionalLight(0xb4c8de, 1.85)', 'new THREE.DirectionalLight(0xb4c8de, 1.35)'),
                  ('moon.castShadow = false;', 'moon.castShadow = true;'),
                  ('moon.shadow.mapSize.set(512, 512);', 'moon.shadow.mapSize.set(1024, 1024);'),
                  ('moon.shadow.bias = -0.0007;', 'moon.shadow.bias = -0.00035;\n  moon.shadow.normalBias = 0.025;'),
                  ('new THREE.PointLight(0xffddb0, 9.5, 36, 1.7)', 'new THREE.PointLight(0xffddb0, 4.2, 36, 1.7)'),
              ],
              Path('src/spatial/sceneRuntime.ts'): [
                  ('scene.environmentIntensity = 0.52;', 'scene.environmentIntensity = 0.42;'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one occurrence of {old!r}, got {count}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Commit one quality increment and remove bootstrap workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-c0-shadow-depth-once.yml
          git add src/SpatialPage.tsx src/spatial/nightIntersectionScene.ts src/spatial/sceneRuntime.ts .github/workflows/apply-c0-shadow-depth-once.yml
          git commit -m 'Add restrained C0 contact shadows and night depth'
          git push origin HEAD:"${GITHUB_REF_NAME}"
