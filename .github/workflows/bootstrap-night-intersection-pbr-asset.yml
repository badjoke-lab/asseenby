name: Bootstrap Night Intersection PBR asset

on:
  push:
    branches:
      - feat/blender-world-authoring-pipeline-20260908
    paths:
      - .github/workflows/bootstrap-night-intersection-pbr-asset.yml

permissions:
  contents: write

jobs:
  fetch-poly-haven-street-lamp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/blender-world-authoring-pipeline-20260908
          fetch-depth: 0

      - name: Fetch and validate CC0 Poly Haven Street Lamp 02 (1K PBR)
        shell: bash
        run: |
          set -euo pipefail
          dest="public/assets/3d/night-intersection/c0/street-lamp-02"
          mkdir -p "$dest/textures"

          gltf_url="https://dl.polyhaven.org/file/ph-assets/Models/gltf/1k/street_lamp_02/street_lamp_02_1k.gltf"
          bin_url="https://dl.polyhaven.org/file/ph-assets/Models/gltf/8k/street_lamp_02/street_lamp_02.bin"
          arm_url="https://dl.polyhaven.org/file/ph-assets/Models/jpg/1k/street_lamp_02/street_lamp_02_arm_1k.jpg"
          diff_url="https://dl.polyhaven.org/file/ph-assets/Models/jpg/1k/street_lamp_02/street_lamp_02_diff_1k.jpg"
          normal_url="https://dl.polyhaven.org/file/ph-assets/Models/jpg/1k/street_lamp_02/street_lamp_02_nor_gl_1k.jpg"

          curl -fL --retry 3 --retry-delay 2 -o "$dest/street_lamp_02_1k.gltf" "$gltf_url"
          curl -fL --retry 3 --retry-delay 2 -o "$dest/street_lamp_02.bin" "$bin_url"
          curl -fL --retry 3 --retry-delay 2 -o "$dest/textures/street_lamp_02_arm_1k.jpg" "$arm_url"
          curl -fL --retry 3 --retry-delay 2 -o "$dest/textures/street_lamp_02_diff_1k.jpg" "$diff_url"
          curl -fL --retry 3 --retry-delay 2 -o "$dest/textures/street_lamp_02_nor_gl_1k.jpg" "$normal_url"

          python3 - "$dest/street_lamp_02_1k.gltf" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as handle:
              data = json.load(handle)

          assert data.get("asset", {}).get("version") == "2.0"
          materials = data.get("materials") or []
          assert materials, "glTF has no materials"
          assert any("normalTexture" in material for material in materials), "no normal texture"
          assert any(
              "baseColorTexture" in material.get("pbrMetallicRoughness", {})
              for material in materials
          ), "no PBR base color texture"
          assert any(
              "metallicRoughnessTexture" in material.get("pbrMetallicRoughness", {})
              for material in materials
          ), "no metallic/roughness texture"
          uris = {image.get("uri") for image in data.get("images", [])}
          required = {
              "textures/street_lamp_02_arm_1k.jpg",
              "textures/street_lamp_02_diff_1k.jpg",
              "textures/street_lamp_02_nor_gl_1k.jpg",
          }
          assert required.issubset(uris), f"missing expected texture URI(s): {required - uris}"
          buffers = {entry.get("uri") for entry in data.get("buffers", [])}
          assert "street_lamp_02.bin" in buffers, "missing external mesh buffer"
          print("Validated glTF 2.0 PBR material structure")
          PY

          for file in \
            "$dest/street_lamp_02_1k.gltf" \
            "$dest/street_lamp_02.bin" \
            "$dest/textures/street_lamp_02_arm_1k.jpg" \
            "$dest/textures/street_lamp_02_diff_1k.jpg" \
            "$dest/textures/street_lamp_02_nor_gl_1k.jpg"; do
            test -s "$file"
          done

          gltf_sha="$(sha256sum "$dest/street_lamp_02_1k.gltf" | awk '{print $1}')"
          {
            echo "Asset: Poly Haven Street Lamp 02"
            echo "Creator: Josh Dean"
            echo "License: CC0-1.0"
            echo "Canonical page: https://polyhaven.com/a/street_lamp_02"
            echo "Runtime source: $gltf_url"
            echo "Fetched glTF SHA-256: $gltf_sha"
            echo "Mesh buffer: $bin_url"
            echo "ARM texture: $arm_url"
            echo "Diffuse texture: $diff_url"
            echo "Normal texture: $normal_url"
          } > "$dest/SOURCE.txt"
          cat "$dest/SOURCE.txt"

      - name: Commit runtime asset to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/3d/night-intersection/c0/street-lamp-02
          if git diff --cached --quiet; then
            echo "Asset already present; nothing to commit."
            exit 0
          fi
          git commit -m "Add first authored Night Intersection PBR asset"
          git push origin HEAD:feat/blender-world-authoring-pipeline-20260908
