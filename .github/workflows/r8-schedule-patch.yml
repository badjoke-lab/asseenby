name: Finalize R8 schedule

on:
  push:
    branches:
      - feat/r8-experience-switch-polish

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/r8-experience-switch-polish
          fetch-depth: 0
      - name: Apply schedule update
        run: python3 scripts/r8-schedule-patch.py
      - name: Remove temporary helpers
        run: rm scripts/r8-schedule-patch.py .github/workflows/r8-schedule-patch.yml
      - name: Commit schedule update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/release-polish-schedule.md scripts/r8-schedule-patch.py .github/workflows/r8-schedule-patch.yml
          git commit -m 'Record R7 completion and R8-1 validation'
          git push
