name: apply R7 sex profile removal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-r7-sex-profile.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply R7-1 removal
        run: python .github/r7-remove-sex-profile.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install temporary browser dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run local browser regression
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/asseenby-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null
          node .github/r7-sex-profile-check.mjs
          node .github/spatial-browser-check.mjs

      - name: Commit implementation and remove temporary helpers
        run: |
          rm .github/r7-remove-sex-profile.py
          rm .github/r7-sex-profile-check.mjs
          rm .github/workflows/apply-r7-sex-profile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove unsupported sex-difference reference mode'
          git push origin HEAD:main
