name: E2 visual rebuild validation

on:
  push:
    branches:
      - feat/e2-night-intersection

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out E2 branch
        uses: actions/checkout@v4
        with:
          ref: feat/e2-night-intersection
          fetch-depth: 0
      - name: Apply renderer polish
        run: python3 scripts/e2_visual_patch.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Install temporary browser dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local production preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/e2-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/e2-preview.log
          exit 1
      - name: Validate E2 geometry and parallax
        run: ASSEENBY_PRODUCTION_URL=http://127.0.0.1:4173 node scripts/e2_validate.mjs
      - name: Commit validated scene polish
        run: |
          if git diff --quiet -- src/SpatialPage.tsx src/spatial/nightIntersectionScene.ts; then exit 0; fi
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add src/SpatialPage.tsx src/spatial/nightIntersectionScene.ts
          git commit -m "Refine Night Intersection presentation"
          git push origin HEAD:feat/e2-night-intersection
      - name: Upload E2 validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2-night-intersection-visual-validation
          path: e2-validation/
          if-no-files-found: warn
