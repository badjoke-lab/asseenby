name: spatial browser check

on:
  push:
    branches:
      - main
      - exp/astra-hansaplatz-c0-20260911
    paths:
      - 'src/spatial/**'
      - 'src/SpatialPage.tsx'
      - 'public/assets/3d/**'
      - 'public/assets/panoramas/**'
      - 'assets-src/**'
      - 'scripts/reference/**'
      - 'scripts/blender/**'
      - 'docs/blender-asset-pipeline.md'
      - '.github/spatial-browser-check.mjs'
      - '.github/spatial-turn-check.mjs'
      - '.github/workflows/spatial-browser-check.yml'
  pull_request:
    paths:
      - 'src/spatial/**'
      - 'src/SpatialPage.tsx'
      - 'public/assets/3d/**'
      - 'public/assets/panoramas/**'
      - 'assets-src/**'
      - 'scripts/reference/**'
      - 'scripts/blender/**'
      - 'docs/blender-asset-pipeline.md'
      - '.github/spatial-browser-check.mjs'
      - '.github/spatial-turn-check.mjs'
      - '.github/workflows/spatial-browser-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install temporary browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start preview and run browser validation
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/asseenby-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null
          # This comprehensive audit now owns desktop drag, W translation,
          # lifecycle remount, mobile touch-turn and all visual captures.
          node .github/spatial-browser-check.mjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-browser-check
          path: browser-check/
          if-no-files-found: error
