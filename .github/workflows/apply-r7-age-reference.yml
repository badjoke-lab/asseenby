name: Apply R7 Age Profile removal

on:
  push:
    branches:
      - feat/r7-age-reference-audit

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/r7-age-reference-audit

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply Age/Reference removal
        run: python scripts/patch_r7_age_reference.py

      - name: Install app dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install temporary browser dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full local production smoke
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/asseenby-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null
          ASSEENBY_PRODUCTION_URL=http://127.0.0.1:4173 node .github/production-smoke.mjs

      - name: Upload local release captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r7-age-reference-audit
          path: production-smoke/
          if-no-files-found: warn

      - name: Commit clean implementation
        if: success()
        run: |
          rm -rf production-smoke
          rm -f scripts/patch_r7_age_reference.py .github/workflows/apply-r7-age-reference.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove unsupported Age Profile reference mode"
          git push origin HEAD:feat/r7-age-reference-audit
