name: E1 Scene Observer Vision validation

on:
  push:
    branches: [feat/e1-scene-observer-vision]
    paths: [.github/workflows/e1-validate.yml]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/e1-scene-observer-vision
          fetch-depth: 0
      - name: Apply E1 patch
        run: |
          python3 scripts/e1_patch.py
          python3 scripts/e1_smoke_fix.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/e1-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/e1-preview.log
          exit 1
      - name: Diagnose exact E1 release fingerprint
        run: ASSEENBY_PRODUCTION_URL=http://127.0.0.1:4173 node scripts/e1_diagnostic.mjs

# diagnostic-only v6: isolate the exact false release-fingerprint condition before rerunning the full suite
