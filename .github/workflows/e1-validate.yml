name: E1 Scene Observer Vision validation

on:
  push:
    branches: [feat/e1-scene-observer-vision]
    paths: [.github/workflows/e1-validate.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/e1-scene-observer-vision
          fetch-depth: 0
      - name: Apply E1 patch
        run: python3 scripts/e1_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/e1-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/e1-preview.log
          exit 1
      - name: Full local browser regression
        run: ASSEENBY_PRODUCTION_URL=http://127.0.0.1:4173 node .github/production-smoke.mjs
      - name: Commit validated E1 product change
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add \
            src/SpatialPage.tsx \
            src/spatial.css \
            src/spatial/catalog.ts \
            src/spatial/sceneRuntime.ts \
            src/spatial/observerRuntime.ts \
            src/spatial/visionRuntime.ts \
            .github/production-smoke.mjs \
            docs/methodology.md \
            docs/limitations.md \
            docs/roadmap.md \
            docs/explore-3d-schedule.md
          git commit -m "Split Explore 3D into Scene Observer and Vision layers"
          git push origin HEAD:feat/e1-scene-observer-vision
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e1-scene-observer-vision-validation
          path: production-smoke/
          if-no-files-found: warn
