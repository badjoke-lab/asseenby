name: Rebuild Hamburg C0 facade recovery

on:
  push:
    branches:
      - feat/c0-hamburg-lod3-quality-20260909
    paths:
      - scripts/blender/remove_hamburg_panorama_wall_projection.py
      - scripts/blender/author_hamburg_hansaplatz_facade_depth.py
      - .github/HANSAPLATZ_SOURCE_TRUTH
      - .github/workflows/rebuild-hamburg-facade-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hamburg-c0-facade-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out current quality branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Blender
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender
          blender --version

      - name: Verify canonical Hamburg source truth
        run: |
          set -euo pipefail
          test -s .github/HANSAPLATZ_SOURCE_TRUTH
          grep -q '^canonical_city_lock=Hamburg$' .github/HANSAPLATZ_SOURCE_TRUTH
          grep -q '^raw_equirectangular_wall_projection=forbidden$' .github/HANSAPLATZ_SOURCE_TRUTH
          grep -q '^lod3_status=official Area1 has a verified Hansaplatz nearfield coverage gap' .github/HANSAPLATZ_SOURCE_TRUTH
          test -s assets-src/blender/night-intersection/c0/night-intersection-c0.blend

      - name: Remove temporary panorama wall projection
        run: |
          set -euo pipefail
          blender --background assets-src/blender/night-intersection/c0/night-intersection-c0.blend \
            --python-exit-code 1 \
            --python scripts/blender/remove_hamburg_panorama_wall_projection.py

      - name: Author bounded nearfield facade depth
        run: |
          set -euo pipefail
          blender --background assets-src/blender/night-intersection/c0/night-intersection-c0.blend \
            --python-exit-code 1 \
            --python scripts/blender/author_hamburg_hansaplatz_facade_depth.py

      - name: Validate Blender scene contract
        run: |
          set -euo pipefail
          blender --background assets-src/blender/night-intersection/c0/night-intersection-c0.blend \
            --python-exit-code 1 \
            --python-expr "import bpy; root=bpy.data.collections.get('C0'); assert root is not None; walls=[o for o in bpy.data.objects if o.name.startswith('lod2_') and o.type=='MESH' and (str(o.get('source_semantic',''))=='wall' or o.name.endswith('_wall'))]; assert walls; bad=[(o.name,s.material.name if s.material else '') for o in walls for s in o.material_slots if s.material and 'panorama_projected' in s.material.name]; assert not bad, bad; authored=[o for o in bpy.data.objects if o.name.startswith('hamburg_authored_facade_')]; assert len(authored)>=4, len(authored); assert root.get('raw_panorama_wall_projection') is False; assert int(root.get('authored_close_facade_buildings',0))>=1; print('WALLS',len(walls)); print('AUTHORED_OBJECTS',len(authored)); print('AUTHORED_BUILDINGS',root.get('authored_close_facade_buildings')); print('AUTHORED_BAYS',root.get('authored_close_facade_bays'))"

      - name: Export recovered C0 GLB
        run: |
          set -euo pipefail
          out=public/assets/3d/night-intersection/c0/core/night-intersection-c0.glb
          mkdir -p "$(dirname "$out")"
          rm -f "$out"
          blender --background assets-src/blender/night-intersection/c0/night-intersection-c0.blend \
            --python-exit-code 1 \
            --python scripts/blender/export_night_intersection.py -- \
            --collection C0 \
            --out "$out"
          test -s "$out"
          sha256sum "$out" > public/assets/3d/night-intersection/c0/core/SHA256SUMS.txt
          cat > public/assets/3d/night-intersection/c0/core/BUILD.txt <<'EOF'
          Canonical location: Hansaplatz, Hamburg-St. Georg, Germany
          Reference coordinates: 53.554451, 10.012056
          Macro geometry: Hamburg official 3D-Gebäudemodell LoD2-DE 2026
          Macro geometry provider: Freie und Hansestadt Hamburg, Landesbetrieb Geoinformation und Vermessung (LGV)
          Macro geometry license: dl-de-by-2.0
          LoD3 nearfield status: official Area1 coverage gap independently verified in 2024 and 2025 archives; do not substitute distant geometry
          Close facade: Blender-authored structural depth over the nearest official LoD2 walls
          Close facade elements: storefront glazing, mullions, upper glazing, sills, heads, floor bands and cornices
          Photographic reference: Poly Haven hansaplatz, CC0-1.0
          Photographic reference use: evidence/far environment only; raw equirectangular wall projection forbidden
          Current close-facade status: structural depth pass; facade-by-facade photo registration remains open
          Runtime: Blender-authored C0 exported to GLB for Three.js
          EOF
          du -h assets-src/blender/night-intersection/c0/night-intersection-c0.blend "$out"
          cat public/assets/3d/night-intersection/c0/core/SHA256SUMS.txt

      - name: Upload recovered C0 proof asset
        uses: actions/upload-artifact@v4
        with:
          name: hamburg-c0-facade-recovery-${{ github.sha }}
          path: |
            assets-src/blender/night-intersection/c0/night-intersection-c0.blend
            public/assets/3d/night-intersection/c0/core/night-intersection-c0.glb
            public/assets/3d/night-intersection/c0/core/BUILD.txt
            public/assets/3d/night-intersection/c0/core/SHA256SUMS.txt
          retention-days: 7

      - name: Commit regenerated C0
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets-src/blender/night-intersection/c0/night-intersection-c0.blend \
            public/assets/3d/night-intersection/c0/core/night-intersection-c0.glb \
            public/assets/3d/night-intersection/c0/core/BUILD.txt \
            public/assets/3d/night-intersection/c0/core/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'No generated C0 changes'
            exit 0
          fi
          git commit -m 'Rebuild Hamburg C0 with authored facade depth'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
