name: Rebuild Hamburg C0 facade recovery

on:
  push:
    branches:
      - feat/c0-hamburg-lod3-quality-20260909
    paths:
      - scripts/blender/remove_hamburg_panorama_wall_projection.py
      - scripts/blender/author_hamburg_hansaplatz_facade_depth.py
      - scripts/blender/author_hamburg_lod2_facades.py
      - .github/hamburg-priority-facade.py
      - .github/HANSAPLATZ_SOURCE_TRUTH
      - .github/workflows/rebuild-hamburg-facade-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hamburg-c0-facade-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out current quality branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Blender
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender python3-numpy
          blender --version
          python3 -c 'import numpy; print(numpy.__version__)'

      - name: Verify canonical Hamburg source truth
        run: |
          set -euo pipefail
          test -s .github/HANSAPLATZ_SOURCE_TRUTH
          grep -q '^canonical_city_lock=Hamburg$' .github/HANSAPLATZ_SOURCE_TRUTH
          grep -q '^raw_equirectangular_wall_projection=forbidden$' .github/HANSAPLATZ_SOURCE_TRUTH
          grep -q '^lod3_status=official Area1 has a verified Hansaplatz nearfield coverage gap' .github/HANSAPLATZ_SOURCE_TRUTH
          test -s assets-src/blender/night-intersection/c0/night-intersection-c0.blend
          test -s assets-src/blender/night-intersection/hamburg-lod2/hansaplatz-lod2.obj
          test -s .github/hamburg-priority-facade.py

      - name: Remove temporary panorama wall projection
        run: |
          set -euo pipefail
          blender --background assets-src/blender/night-intersection/c0/night-intersection-c0.blend \
            --python-exit-code 1 \
            --python scripts/blender/remove_hamburg_panorama_wall_projection.py

      - name: Remove legacy axis-aligned generic facade layer
        run: |
          set -euo pipefail
          blender --background assets-src/blender/night-intersection/c0/night-intersection-c0.blend \
            --python-exit-code 1 \
            --python-expr "import bpy; doomed=[o for o in list(bpy.data.objects) if o.name.startswith('hamburg_authored_facade_')]; [bpy.data.objects.remove(o, do_unlink=True) for o in doomed]; root=bpy.data.collections.get('C0'); root['authored_close_facade']=False; root['authored_close_facade_buildings']=0; root['authored_close_facade_bays']=0; bpy.ops.wm.save_as_mainfile(filepath=bpy.data.filepath); print('REMOVED_LEGACY_AUTHORED', len(doomed))"

      - name: Author camera-priority wall-plane nearfield facades
        run: |
          set -euo pipefail
          blender --background assets-src/blender/night-intersection/c0/night-intersection-c0.blend \
            --python-exit-code 1 \
            --python .github/hamburg-priority-facade.py -- \
            --collection C0 \
            --obj assets-src/blender/night-intersection/hamburg-lod2/hansaplatz-lod2.obj \
            --radius-m 95 \
            --max-facades 40

      - name: Validate Blender scene contract
        run: |
          set -euo pipefail
          blender --background assets-src/blender/night-intersection/c0/night-intersection-c0.blend \
            --python-exit-code 1 \
            --python-expr "import bpy; root=bpy.data.collections.get('C0'); assert root is not None; walls=[o for o in bpy.data.objects if o.name.startswith('lod2_') and o.type=='MESH' and (str(o.get('source_semantic',''))=='wall' or o.name.endswith('_wall'))]; assert walls; bad=[(o.name,s.material.name if s.material else '') for o in walls for s in o.material_slots if s.material and 'panorama_projected' in s.material.name]; assert not bad, bad; legacy=[o.name for o in bpy.data.objects if o.name.startswith('hamburg_authored_facade_')]; assert not legacy, legacy; authored=[o for o in bpy.data.objects if o.name.startswith('hamburg_facade_authored_')]; assert len(authored)>=5, len(authored); assert root.get('raw_panorama_wall_projection') is False; assert root.get('hamburg_facade_panorama_projection') is False; assert int(root.get('hamburg_facade_selection_priority_version',0))==2; assert int(root.get('hamburg_facade_authored_face_count',0))>=20; assert int(root.get('hamburg_facade_authored_window_count',0))>=40; assert int(root.get('hamburg_facade_authored_shopfront_count',0))>=10; print('WALLS',len(walls)); print('AUTHORED_OBJECTS',len(authored)); print('SELECTION_BASIS',root.get('hamburg_facade_selection_basis')); print('AUTHORED_FACES',root.get('hamburg_facade_authored_face_count')); print('AUTHORED_WINDOWS',root.get('hamburg_facade_authored_window_count')); print('AUTHORED_SHOPFRONTS',root.get('hamburg_facade_authored_shopfront_count')); print('AUTHORED_BAYS',root.get('hamburg_facade_authored_bay_count'))"

      - name: Export recovered C0 GLB
        run: |
          set -euo pipefail
          out=public/assets/3d/night-intersection/c0/core/night-intersection-c0.glb
          mkdir -p "$(dirname "$out")"
          rm -f "$out"
          blender --background assets-src/blender/night-intersection/c0/night-intersection-c0.blend \
            --python-exit-code 1 \
            --python scripts/blender/export_night_intersection.py -- \
            --collection C0 \
            --out "$out"
          test -s "$out"
          sha256sum "$out" > public/assets/3d/night-intersection/c0/core/SHA256SUMS.txt
          cat > public/assets/3d/night-intersection/c0/core/BUILD.txt <<'EOF'
          Canonical location: Hansaplatz, Hamburg-St. Georg, Germany
          Reference coordinates: 53.554451, 10.012056
          Macro geometry: Hamburg official 3D-Gebäudemodell LoD2-DE 2026
          Macro geometry provider: Freie und Hansestadt Hamburg, Landesbetrieb Geoinformation und Vermessung (LGV)
          Macro geometry license: dl-de-by-2.0
          LoD3 nearfield status: official Area1 coverage gap independently verified in 2024 and 2025 archives; do not substitute distant geometry
          Close facade: Blender-authored geometry aligned to actual Hamburg LoD2 wall planes, not axis-aligned wall bounding boxes
          Close facade selection: camera-priority ranking for the initial yaw=0 / forward=-Z view, weighted by view angle and projected wall area
          Close facade elements: recessed glazing cues, storefronts, mullions, frames, sills, lintels, floor bands, plinths, cornices and bounded projecting bays
          Nearfield authoring scope: wall faces within 95 m, capped at 40 selected facade faces
          Photographic reference: Poly Haven hansaplatz, CC0-1.0
          Photographic reference use: evidence/far environment only; raw equirectangular wall projection forbidden
          Current close-facade status: structural wall-plane pass; facade-by-facade photographic registration remains open
          Runtime: Blender-authored C0 exported to GLB for Three.js
          EOF
          du -h assets-src/blender/night-intersection/c0/night-intersection-c0.blend "$out"
          cat public/assets/3d/night-intersection/c0/core/SHA256SUMS.txt

      - name: Upload recovered C0 proof asset
        uses: actions/upload-artifact@v4
        with:
          name: hamburg-c0-facade-recovery-${{ github.sha }}
          path: |
            assets-src/blender/night-intersection/c0/night-intersection-c0.blend
            public/assets/3d/night-intersection/c0/core/night-intersection-c0.glb
            public/assets/3d/night-intersection/c0/core/BUILD.txt
            public/assets/3d/night-intersection/c0/core/SHA256SUMS.txt
          retention-days: 7

      - name: Commit regenerated C0
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets-src/blender/night-intersection/c0/night-intersection-c0.blend \
            public/assets/3d/night-intersection/c0/core/night-intersection-c0.glb \
            public/assets/3d/night-intersection/c0/core/BUILD.txt \
            public/assets/3d/night-intersection/c0/core/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo 'No generated C0 changes'
            exit 0
          fi
          git commit -m 'Rebuild Hamburg C0 with camera-priority facades'
          echo 'Transient files before cleanup:'
          git status --short || true
          git reset --hard HEAD
          git clean -fd
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
