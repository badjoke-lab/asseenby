name: Build Hansaplatz C0 from Hamburg LoD2

on:
  push:
    branches:
      - feat/c0-hamburg-hansaplatz-source-truth-20260909
    paths:
      - scripts/hamburg/**
      - assets-src/blender/night-intersection/hamburg-lod2/**
      - scripts/blender/apply_berlin_lod2_hansaplatz.py
      - scripts/blender/replace_hansaplatz_paving_field.py
      - .github/workflows/build-hansaplatz-lod2-c0.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hamburg-hansaplatz-lod2-c0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lod2-c0:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out current quality branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends blender
          blender --version

      - name: Verify Hamburg source truth
        shell: bash
        run: |
          set -euo pipefail
          source_json=assets-src/blender/night-intersection/hamburg-lod2/SOURCE.json
          obj=assets-src/blender/night-intersection/hamburg-lod2/hansaplatz-lod2.obj
          panorama=public/assets/panoramas/hansaplatz.jpg
          test -s "$source_json"
          test -s "$obj"
          test -s "$panorama"
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('assets-src/blender/night-intersection/hamburg-lod2/SOURCE.json').read_text())
          ref = source['reference']
          assert source['provider'] == 'Freie und Hansestadt Hamburg, Landesbetrieb Geoinformation und Vermessung (LGV)'
          assert source['license'] == 'dl-de-by-2.0'
          assert abs(ref['lat'] - 53.554451) < 1e-8
          assert abs(ref['lon'] - 10.012056) < 1e-8
          assert ref['location'] == 'Hansaplatz, Hamburg-St. Georg, Germany'
          assert source['output']['building_count'] >= 100
          print(json.dumps(source, indent=2, ensure_ascii=False))
          PY
          sha256sum -c assets-src/blender/night-intersection/hamburg-lod2/SHA256SUMS.txt
          grep -c '^o lod2_' "$obj"
          du -h "$obj"

      - name: Prepare Hamburg metadata-safe LoD2 importer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          cp scripts/blender/apply_berlin_lod2_hansaplatz.py .tmp/apply_hamburg_lod2_hansaplatz.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.tmp/apply_hamburg_lod2_hansaplatz.py')
          text = path.read_text()
          replacements = {
              'official Berlin LoD2 geometry': 'official Hamburg LoD2-DE geometry',
              'Berlin official cadastral LoD2': 'Hamburg official LoD2-DE, GPS-aligned to Poly Haven Hansaplatz',
              'Senatsverwaltung für Stadtentwicklung, Bauen und Wohnen Berlin': 'Freie und Hansestadt Hamburg, Landesbetrieb Geoinformation und Vermessung (LGV)',
              '3D-Gebäudemodelle im Level of Detail 2 (LoD 2)': '3D-Gebäudemodell LoD2-DE Hamburg 2026',
              'dl-de-zero-2.0': 'dl-de-by-2.0',
              'https://gdi.berlin.de/data/a_lod2/atom/0.atom': 'https://daten-hamburg.de/opendata/3d_stadtmodell_lod2/LoD2-DE_HH_2026-04-28.zip',
              'Hansaplatz, Berlin, Germany': 'Hansaplatz, Hamburg-St. Georg, Germany',
              'Berlin LoD2 Hansaplatz applied': 'Hamburg LoD2 Hansaplatz applied',
              'berlin_lod2_wall_reference': 'hamburg_lod2_wall_reference',
              'berlin_lod2_roof_reference': 'hamburg_lod2_roof_reference',
              'berlin_lod2_ground_reference': 'hamburg_lod2_ground_reference',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text)
          PY
          grep -q 'Hansaplatz, Hamburg-St. Georg, Germany' .tmp/apply_hamburg_lod2_hansaplatz.py
          if grep -q 'Hansaplatz, Berlin, Germany' .tmp/apply_hamburg_lod2_hansaplatz.py; then
            echo 'Berlin location survived Hamburg importer patch' >&2
            exit 1
          fi

      - name: Apply official Hamburg geometry and photographic facade projection
        shell: bash
        run: |
          set -euo pipefail
          blend=assets-src/blender/night-intersection/c0/night-intersection-c0.blend
          panorama=public/assets/panoramas/hansaplatz.jpg
          obj=assets-src/blender/night-intersection/hamburg-lod2/hansaplatz-lod2.obj
          test -s "$blend"
          blender --background "$blend" \
            --python .tmp/apply_hamburg_lod2_hansaplatz.py -- \
            --collection C0 \
            --obj "$obj" \
            --panorama "$panorama" \
            --panorama-yaw-deg 0

      - name: Keep temporary continuous plaza surface
        shell: bash
        run: |
          set -euo pipefail
          blend=assets-src/blender/night-intersection/c0/night-intersection-c0.blend
          blender --background "$blend" \
            --python scripts/blender/replace_hansaplatz_paving_field.py

      - name: Export updated Hamburg C0 GLB
        shell: bash
        run: |
          set -euo pipefail
          out=public/assets/3d/night-intersection/c0/core/night-intersection-c0.glb
          mkdir -p "$(dirname "$out")"
          blender --background assets-src/blender/night-intersection/c0/night-intersection-c0.blend \
            --python scripts/blender/export_night_intersection.py -- \
            --collection C0 \
            --out "$out"
          test -s "$out"
          sha256sum "$out" > public/assets/3d/night-intersection/c0/core/SHA256SUMS.txt
          cat > public/assets/3d/night-intersection/c0/core/BUILD.txt <<'EOF'
          Geometry basis: Hamburg official 3D-Gebäudemodell LoD2-DE Hamburg 2026
          Reference location: Hansaplatz, Hamburg-St. Georg, Germany
          Reference coordinates: 53.554451, 10.012056
          Official source: https://daten-hamburg.de/opendata/3d_stadtmodell_lod2/LoD2-DE_HH_2026-04-28.zip
          Geometry provider: Freie und Hansestadt Hamburg, Landesbetrieb Geoinformation und Vermessung (LGV)
          Geometry license: dl-de-by-2.0
          Geometry attribution: Freie und Hansestadt Hamburg, Landesbetrieb Geoinformation und Vermessung (LGV)
          Derived subset: assets-src/blender/night-intersection/hamburg-lod2/hansaplatz-lod2.obj
          Derived subset scope: 170 m radius, 113 buildings, EPSG:25832 source frame
          Facade detail basis: Poly Haven Hansaplatz equirectangular panorama projection
          Facade source: https://polyhaven.com/a/hansaplatz
          Facade source license: CC0-1.0
          Projection origin: Human reference eye at runtime XYZ 0,1.6,0
          Plaza paving: temporary continuous coplanar Blender mesh; replace with reference-derived Hamburg ground geometry next
          Runtime: Blender-authored C0 exported to GLB for Three.js
          EOF
          cat public/assets/3d/night-intersection/c0/core/SHA256SUMS.txt
          du -h assets-src/blender/night-intersection/c0/night-intersection-c0.blend "$out"

      - name: Commit generated Hamburg C0 to quality branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets-src/blender/night-intersection/c0/night-intersection-c0.blend \
            public/assets/3d/night-intersection/c0/core
          if git diff --cached --quiet; then
            echo 'No generated Hamburg C0 changes'
            exit 0
          fi
          git commit -m 'Rebuild C0 from real Hamburg Hansaplatz geometry'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
