name: R8 spatial nav validate

on:
  push:
    branches:
      - feat/r8-spatial-nav-cleanup

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Run R8-2 patch validation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/r8-spatial-nav-cleanup
          fetch-depth: 0
      - name: Apply R8-2 patch
        run: python3 scripts/r8-spatial-nav-patch.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full local browser smoke
        shell: bash
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 > /tmp/asseenby-r8-preview.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.5
          done
          ASSEENBY_PRODUCTION_URL=http://127.0.0.1:4173 node .github/production-smoke.mjs
      - name: Commit validated implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/SpatialPage.tsx .github/production-smoke.mjs docs/release-polish-schedule.md
          git commit -m 'Apply R8-2 spatial nav cleanup'
          git push
      - name: Upload browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-spatial-nav-smoke
          path: production-smoke
