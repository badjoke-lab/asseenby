name: Patch production spatial smoke Day Night

on:
  push:
    branches:
      - fix/production-spatial-smoke-day-night-20260911
    paths:
      - .github/patch-production-spatial-smoke-day-night.py
      - .github/workflows/patch-production-spatial-smoke-day-night.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/production-spatial-smoke-day-night-20260911
          fetch-depth: 0

      - name: Apply repair
        run: python3 .github/patch-production-spatial-smoke-day-night.py

      - name: Validate JavaScript syntax
        run: |
          node --check .github/production-smoke.mjs
          node --check .github/production-spatial-c0-check.mjs

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/production-smoke.mjs .github/production-spatial-c0-check.mjs
          git commit -m 'Fix production spatial smoke for Day Night contract'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
