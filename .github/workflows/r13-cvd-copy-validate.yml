name: R13 CVD copy validation

on:
  push:
    branches: [fix/r13-cvd-mode-copy]
    paths: [.github/workflows/r13-cvd-copy-validate.yml]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r13-cvd-mode-copy
          fetch-depth: 0
      - name: Patch public CVD copy and schedule
        run: |
          python3 - <<'PY'
          from pathlib import Path

          modes = Path('src/modes.ts')
          text = modes.read_text()
          text = text.replace(
              'note: "Reduced red-channel discrimination approximation."',
              'note: "Protanomaly-style red-green color-discrimination approximation."',
          )
          text = text.replace(
              'note: "Reduced green-channel discrimination approximation."',
              'note: "Deuteranomaly-style red-green color-discrimination approximation."',
          )
          modes.write_text(text)

          schedule = Path('docs/release-polish-schedule.md')
          text = schedule.read_text()
          old = 'Status: **Step R12 PASS / resolution-normalized image blur production verified / R11 CVD model fidelity production verified**'
          new = 'Status: **Step R13 VALIDATED / CVD public mode copy accuracy / awaiting production verification**'
          if old not in text:
              raise SystemExit('current state marker not found')
          text = text.replace(old, new, 1)
          text += '''\n\n## Step R13 — CVD public mode copy accuracy\nStatus: **PASS / validated / awaiting production verification**\n\nFinding:\n- R11 aligned Protan-like / Deutan-like / Tritan-like with the Machado severity-matrix model, but the short public mode notes in `src/modes.ts` still described Protan-like as `Reduced red-channel` and Deutan-like as `Reduced green-channel`;\n- those phrases imply simple RGB channel reduction, which is not the current renderer and is less accurate than the already-correct methodology/evidence wording.\n\nImplementation:\n- describe Protan-like as a protanomaly-style red-green color-discrimination approximation;\n- describe Deutan-like as a deuteranomaly-style red-green color-discrimination approximation;\n- do not change the R11 renderer, evidence scores, Strength semantics, or other public modes.\n\nAcceptance:\n- public copy no longer describes Protan-like / Deutan-like as simple red/green channel reduction — **PASS**;\n- browser-rendered page contains the corrected protanomaly/deuteranomaly wording — **PASS**;\n- typecheck/build and full local desktop/390px image + spatial regression remain green — **PASS**;\n- matching main build and production copy verification remain required before production closeout.\n'''
          schedule.write_text(text)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/r13-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/r13-preview.log
          exit 1
      - name: Verify corrected public copy
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          const text = await page.locator('body').innerText();
          if (!text.includes('Protanomaly-style red-green color-discrimination approximation.')) throw new Error('corrected Protan copy missing');
          if (!text.includes('Deuteranomaly-style red-green color-discrimination approximation.')) throw new Error('corrected Deutan copy missing');
          if (text.includes('Reduced red-channel discrimination approximation.')) throw new Error('stale Protan channel copy remains');
          if (text.includes('Reduced green-channel discrimination approximation.')) throw new Error('stale Deutan channel copy remains');
          await browser.close();
          NODE
      - name: Full local browser regression
        run: ASSEENBY_PRODUCTION_URL=http://127.0.0.1:4173 node .github/production-smoke.mjs
      - name: Commit validated product change
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add src/modes.ts docs/release-polish-schedule.md
          git commit -m "Correct public CVD mode descriptions"
          git push origin HEAD:fix/r13-cvd-mode-copy
