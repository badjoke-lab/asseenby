name: apply image release polish v2

on:
  push:
    branches:
      - feat/image-release-polish-a11y
    paths:
      - .github/workflows/apply-image-release-polish-v2.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/image-release-polish-a11y

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply accessibility release polish
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('src/App.tsx')
          text = app.read_text()
          replacements = [
              ('<section className="compare-card">', '<section className="compare-card" aria-busy={isBusy}>', 'compare busy state'),
              ('{isBusy ? <div className="loading-badge" /> : null}', '{isBusy ? <div className="loading-badge" role="status" aria-live="polite" aria-label="Rendering comparison" /> : null}', 'loading status'),
              ('<input type="range" min={20} max={80} value={divider} onChange={(event) => setDivider(Number(event.target.value))} />', '<input id="compare-balance" type="range" min={20} max={80} value={divider} aria-label="Comparison balance" onChange={(event) => setDivider(Number(event.target.value))} />', 'balance range'),
              ('<label className="control-label">Category</label>\n        <SelectLike value={category}', '<label className="control-label" htmlFor="category-select">Category</label>\n        <SelectLike id="category-select" value={category}', 'category label'),
              ('<label className="control-label">Mode</label>\n        <SelectLike value={modeKey}', '<label className="control-label" htmlFor="mode-select">Mode</label>\n        <SelectLike id="mode-select" value={modeKey}', 'mode label'),
              ('<label className="control-label">Strength</label>\n        <div className="strength-row">\n          <input type="range" min={0} max={100} value={strength}', '<label className="control-label" htmlFor="strength-range">Strength</label>\n        <div className="strength-row">\n          <input id="strength-range" type="range" min={0} max={100} value={strength}', 'strength label'),
              ('<button className="primary-button" onClick={onUploadClick}>Upload image</button>', '<button type="button" className="primary-button" onClick={onUploadClick}>Upload image</button>', 'upload button type'),
              ('<button className="secondary-button" onClick={onUseSample}>Use sample image</button>', '<button type="button" className="secondary-button" onClick={onUseSample}>Use sample image</button>', 'sample button type'),
              ('<button onClick={onClick} className="category-card">', '<button type="button" onClick={onClick} className="category-card">', 'category button type'),
              ('function SelectLike({ value, options, onChange, labels }: { value: string; options: string[]; onChange: (value: string) => void; labels?: Record<string, string>; }) {\n  return (\n    <select className="control-select" value={value}', 'function SelectLike({ id, value, options, onChange, labels }: { id?: string; value: string; options: string[]; onChange: (value: string) => void; labels?: Record<string, string>; }) {\n  return (\n    <select id={id} className="control-select" value={value}', 'select id support'),
              ('function ComparePill({ children, active, onClick }: { children: React.ReactNode; active?: boolean; onClick?: () => void; }) {\n  return <button onClick={onClick} className={active ? "pill pill--active" : "pill"}>{children}</button>;\n}', 'function ComparePill({ children, active, onClick }: { children: React.ReactNode; active?: boolean; onClick?: () => void; }) {\n  return <button type="button" aria-pressed={Boolean(active)} onClick={onClick} className={active ? "pill pill--active" : "pill"}>{children}</button>;\n}', 'compare button state'),
          ]
          for old, new, label in replacements:
              if old not in text:
                  raise SystemExit(f"anchor missing: {label}")
              text = text.replace(old, new, 1)
          app.write_text(text)

          styles = Path('src/styles.css')
          css = styles.read_text()
          anchor = '''a {\n  color: inherit;\n  text-decoration: none;\n}\n'''
          focus = '''a {\n  color: inherit;\n  text-decoration: none;\n}\n\na:focus-visible,\nbutton:focus-visible,\nselect:focus-visible,\ninput[type="range"]:focus-visible {\n  outline: 2px solid #8b6c32;\n  outline-offset: 3px;\n}\n'''
          if anchor not in css:
              raise SystemExit('anchor missing: focus styles')
          styles.write_text(css.replace(anchor, focus, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install temporary browser dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify image controls and full browser regression
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/asseenby-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null
          node .github/spatial-browser-check.mjs
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });

          const category = page.getByLabel('Category');
          const mode = page.getByLabel('Mode');
          const strength = page.getByLabel('Strength');
          if (await category.count() !== 1) throw new Error('Category label is not associated with exactly one control');
          if (await mode.count() !== 1) throw new Error('Mode label is not associated with exactly one control');
          if (await strength.count() !== 1) throw new Error('Strength label is not associated with exactly one control');

          const slider = page.getByRole('button', { name: 'Slider', exact: true });
          const split = page.getByRole('button', { name: 'Split', exact: true });
          if (await slider.getAttribute('aria-pressed') !== 'true') throw new Error('Slider initial pressed state missing');
          if (await split.getAttribute('aria-pressed') !== 'false') throw new Error('Split initial pressed state missing');
          await split.click();
          if (await split.getAttribute('aria-pressed') !== 'true') throw new Error('Split pressed state did not update');
          if (await slider.getAttribute('aria-pressed') !== 'false') throw new Error('Slider pressed state did not clear');

          await page.reload({ waitUntil: 'networkidle' });
          const upload = page.getByRole('button', { name: 'Upload image', exact: true });
          let reachedUpload = false;
          for (let i = 0; i < 40; i += 1) {
            await page.keyboard.press('Tab');
            if (await upload.evaluate((el) => el === document.activeElement)) {
              reachedUpload = true;
              break;
            }
          }
          if (!reachedUpload) throw new Error('Keyboard tab order did not reach Upload image');
          const focusStyle = await upload.evaluate((el) => {
            const style = getComputedStyle(el);
            return { outlineStyle: style.outlineStyle, outlineWidth: style.outlineWidth };
          });
          if (focusStyle.outlineStyle === 'none' || focusStyle.outlineWidth === '0px') {
            throw new Error(`Keyboard focus outline is missing: ${JSON.stringify(focusStyle)}`);
          }

          await browser.close();
          NODE

      - name: Commit implementation and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-image-release-polish.yml .github/workflows/apply-image-release-polish-v2.yml
          git add src/App.tsx src/styles.css
          git commit -m "Improve image viewer control accessibility"
          git push
