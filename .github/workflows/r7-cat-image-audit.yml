name: R7 Cat-like image audit

on:
  push:
    branches:
      - feat/r7-cat-image-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Compare Dog-like and Cat-like image outputs
        shell: bash
        timeout-minutes: 5
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/asseenby-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          mkdir -p cat-audit
          cat > .github/r7-cat-audit.mjs <<'JS'
          import { chromium } from "playwright";
          import fs from "node:fs/promises";

          const BASE = "http://127.0.0.1:4173";
          const strengths = [40, 70, 100];

          async function setStrength(page, value) {
            await page.locator("#strength-range").evaluate((el, v) => {
              el.value = String(v);
              el.dispatchEvent(new Event("input", { bubbles: true }));
              el.dispatchEvent(new Event("change", { bubbles: true }));
            }, value);
            await page.waitForTimeout(180);
            await page.waitForFunction(() => document.querySelector('.compare-card')?.getAttribute('aria-busy') === 'false');
          }

          async function saveFrame(page, alt, key) {
            await page.locator(`img[alt="${alt}"]`).first().evaluate(async (img, frameKey) => {
              if (!img.complete) await new Promise(resolve => img.addEventListener("load", resolve, { once: true }));
              const canvas = document.createElement("canvas");
              canvas.width = img.naturalWidth;
              canvas.height = img.naturalHeight;
              const ctx = canvas.getContext("2d", { willReadFrequently: true });
              ctx.drawImage(img, 0, 0);
              window.__r7Frames ??= {};
              window.__r7Frames[frameKey] = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
            }, key);
          }

          async function renderAndSave(page, mode, strength, key) {
            await page.locator("#mode-select").selectOption(mode);
            await setStrength(page, strength);
            await page.waitForFunction(() => document.querySelector('img[alt="Approximation"]')?.getAttribute("src")?.startsWith("blob:"));
            await saveFrame(page, "Approximation", key);
          }

          async function compareSaved(page, keyA, keyB) {
            return await page.evaluate(([aKey, bKey]) => {
              const a = window.__r7Frames[aKey];
              const b = window.__r7Frames[bKey];
              if (!a || !b || a.length !== b.length) throw new Error(`missing/mismatched frames ${aKey}/${bKey}`);
              let sum = 0, changed10 = 0, changed25 = 0, maxDelta = 0;
              const pixels = a.length / 4;
              for (let i = 0; i < a.length; i += 4) {
                const dr = Math.abs(a[i] - b[i]);
                const dg = Math.abs(a[i + 1] - b[i + 1]);
                const db = Math.abs(a[i + 2] - b[i + 2]);
                const m = Math.max(dr, dg, db);
                sum += dr + dg + db;
                if (m >= 10) changed10 += 1;
                if (m >= 25) changed25 += 1;
                if (m > maxDelta) maxDelta = m;
              }
              return {
                meanAbsChannelDelta: sum / (pixels * 3),
                changedPixelsPct10: changed10 * 100 / pixels,
                changedPixelsPct25: changed25 * 100 / pixels,
                maxChannelDelta: maxDelta,
              };
            }, [keyA, keyB]);
          }

          const browser = await chromium.launch({ headless: true });
          const results = { checkedAt: new Date().toISOString(), cases: [] };
          try {
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            const page = await context.newPage();
            await page.goto(BASE, { waitUntil: "networkidle" });
            await page.locator("#category-select").selectOption("Animal");

            const chart = {
              name: "cat-dog-audit.svg",
              mimeType: "image/svg+xml",
              buffer: Buffer.from(`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><rect width="900" height="600" fill="#ddd"/><rect width="150" height="220" x="0" fill="#e51b23"/><rect width="150" height="220" x="150" fill="#25a244"/><rect width="150" height="220" x="300" fill="#1769ff"/><rect width="150" height="220" x="450" fill="#f4d03f"/><rect width="150" height="220" x="600" fill="#00c7c7"/><rect width="150" height="220" x="750" fill="#d946ef"/><defs><pattern id="g" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#111" stroke-width="1.5"/></pattern></defs><rect y="240" width="450" height="230" fill="url(#g)"/><rect x="450" y="240" width="450" height="230" fill="#fff"/><g font-family="Arial" fill="#111"><text x="475" y="285" font-size="24">Fine detail</text><text x="475" y="330" font-size="12">small text 12 px</text><text x="475" y="380" font-size="20">medium text 20 px</text><text x="475" y="440" font-size="32">large text 32 px</text></g>${Array.from({length:9},(_,i)=>`<rect x="${i*100}" y="500" width="100" height="100" fill="rgb(${i*31},${i*31},${i*31})"/>`).join("")}</svg>`),
            };

            for (const scenario of ["built-in sample", "controlled color-detail chart"]) {
              if (scenario === "controlled color-detail chart") {
                await page.locator('input[type="file"]').setInputFiles(chart);
                await page.waitForFunction(() => document.querySelector('img[alt="Original"]')?.getAttribute("src")?.startsWith("blob:"));
              } else {
                await page.getByRole("button", { name: "Use sample image" }).click();
                await page.waitForTimeout(120);
              }
              await page.evaluate(() => { window.__r7Frames = {}; });
              await saveFrame(page, "Original", "original");
              for (const strength of strengths) {
                const dogKey = `dog-${strength}`;
                const catKey = `cat-${strength}`;
                await renderAndSave(page, "dog", strength, dogKey);
                await renderAndSave(page, "cat", strength, catKey);
                results.cases.push({
                  scenario,
                  strength,
                  dogVsOriginal: await compareSaved(page, dogKey, "original"),
                  catVsOriginal: await compareSaved(page, catKey, "original"),
                  dogVsCat: await compareSaved(page, dogKey, catKey),
                });
              }
            }
            await context.close();
          } finally {
            await browser.close();
          }
          await fs.writeFile("cat-audit/results.json", JSON.stringify(results, null, 2));
          console.log(JSON.stringify(results, null, 2));
          JS
          node .github/r7-cat-audit.mjs
          rm .github/r7-cat-audit.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: r7-cat-image-audit
          path: cat-audit/results.json
