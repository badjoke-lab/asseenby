name: R14 closeout docs

on:
  push:
    branches: [docs/r14-production-closeout]
    paths: [.github/workflows/r14-closeout-docs.yml]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/r14-production-closeout
      - name: Record R14 production verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/release-polish-schedule.md')
          text = p.read_text()
          text = text.replace(
              'Status: **Step R14 VALIDATED / built-in sample intrinsic resolution / awaiting production verification**',
              'Status: **Step R14 PASS / built-in sample intrinsic resolution production verified**',
              1,
          )
          text = text.replace(
              '## Step R14 — Built-in sample intrinsic resolution\nStatus: **PASS / validated / awaiting production verification**',
              '## Step R14 — Built-in sample intrinsic resolution\nStatus: **PASS / production verified**',
              1,
          )
          marker = '- matching main build and production smoke remain required before R14 production closeout.'
          replacement = '''- matching main build and production smoke remain required before R14 production closeout — **PASS**.\n\nProduction verification:\n- corrected local/browser validation `34077219568` — **success**; browser measured Original **1440×900** and transformed Approximation **1400×875**, and full desktop/390px image + spatial regression passed; artifact `10002503655`;\n- PR #37 build `34091507802` — **success**;\n- PR #37 squash-merged as `ef4f6a507b069249534c8ce4bcb0886f97145abe`;\n- matching main build `34091555355` — **success**;\n- production smoke run `34091555251` attempt 1 — **expected deploy-lag failure**, correctly detecting the still-old public sample as **240×150**;\n- the same production smoke run `34091555251` attempt 2 — **success** after production deployment updated; permanent assertions for Original **1440×900** and transformed **1400×875** passed together with the full production browser suite;\n- successful production-smoke artifact `10007063576` retained.\n\n## Step R14 closeout\nStatus: **PASS / production verified**\n\nR14 is closed. The built-in sample now has explicit intrinsic dimensions matching its intended 1440×900 design, preprocessing produces 1400×875 for transforms, and the R12 900 px normalization denominator remains unchanged. No transform coefficient, Evidence/Model grade, Strength semantic, or spatial renderer changed.\n\nResume the remaining transform/evidence audit and open another release step only for a concrete renderer, output, evidence, or public-claim defect.'''
          if marker not in text:
              raise SystemExit('R14 acceptance marker not found')
          text = text.replace(marker, replacement, 1)
          p.write_text(text)
          PY
      - name: Commit closeout
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add docs/release-polish-schedule.md
          git commit -m "Record R14 production closeout"
          git push origin HEAD:docs/r14-production-closeout
