name: cleanup R7 Bee baselines

on:
  push:
    branches: [feat/r7-remove-bee-image]
    paths:
      - '.github/workflows/cleanup-r7-bee-baselines.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/r7-remove-bee-image
          fetch-depth: 0
      - name: Restore unrelated browser baselines and remove helper
        run: |
          git fetch origin main
          git checkout origin/main -- browser-check/desktop-image-baseline.png browser-check/mobile-image-baseline.png
          rm .github/workflows/cleanup-r7-bee-baselines.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore unrelated browser baselines'
          git push origin HEAD:feat/r7-remove-bee-image
