name: R8 experience switch check

on:
  push:
    branches:
      - feat/r8-experience-switch-polish

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run switch browser check
        run: node scripts/r8-switch-check.mjs
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-switch-check
          path: r8-switch-check
