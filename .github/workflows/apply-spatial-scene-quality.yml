name: apply spatial scene quality upgrade

on:
  push:
    branches:
      - feat/spatial-central-loss
    paths:
      - scripts/upgrade_spatial_scene.py
      - .github/workflows/apply-spatial-scene-quality.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/spatial-central-loss

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply scene quality patch
        run: python scripts/upgrade_spatial_scene.py

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit scene upgrade and remove temporary patch machinery
        run: |
          rm scripts/upgrade_spatial_scene.py
          rm .github/workflows/apply-spatial-scene-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild spatial night street presentation"
          git push
