name: Probe Hansaplatz Hamburg LoD3 building coverage

on:
  push:
    branches:
      - feat/c0-hamburg-lod3-quality-20260909
    paths:
      - .github/workflows/probe-hansaplatz-lod3-building-coverage.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download official Hamburg LoD3 Area1
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 3 \
            --user-agent 'AsSeenBy-LoD3-coverage-probe/1.0' \
            'https://daten-hamburg.de/opendata/3d_stadtmodell_lod3/LoD3-HH_Area1_noTexture_2025_03_13.zip' \
            -o /tmp/lod3.zip
          test -s /tmp/lod3.zip
      - name: Scan every LoD3 building geometry against Hansaplatz
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import math
          import zipfile
          import xml.etree.ElementTree as ET

          TARGET_E = 567045.146949287
          TARGET_N = 5934427.863514651
          GML_ID = '{http://www.opengis.net/gml}id'

          def local(tag):
              return tag.rsplit('}', 1)[-1]

          def parse_points(building):
              points = []
              for node in building.iter():
                  if local(node.tag) not in {'posList', 'pos'} or not node.text:
                      continue
                  try:
                      values = [float(v) for v in node.text.replace(',', ' ').split()]
                  except ValueError:
                      continue
                  if local(node.tag) == 'pos':
                      dims = [len(values)]
                  else:
                      attr = node.attrib.get('srsDimension') or node.attrib.get('dimension')
                      if attr and attr.isdigit() and int(attr) in (2,3,4):
                          dims = [int(attr)]
                      elif len(values) % 3 == 0:
                          dims = [3]
                      elif len(values) % 2 == 0:
                          dims = [2]
                      else:
                          continue
                  dim = dims[0]
                  for i in range(0, len(values) - 1, dim):
                      a, b = values[i], values[i+1]
                      if 100000 <= a <= 900000 and 5000000 <= b <= 7000000:
                          e, n = a, b
                      elif 5000000 <= a <= 7000000 and 100000 <= b <= 900000:
                          e, n = b, a
                      else:
                          continue
                      points.append((e,n))
              return points

          def bbox_distance(points):
              min_e = min(p[0] for p in points); max_e = max(p[0] for p in points)
              min_n = min(p[1] for p in points); max_n = max(p[1] for p in points)
              dx = 0.0 if min_e <= TARGET_E <= max_e else min(abs(TARGET_E-min_e), abs(TARGET_E-max_e))
              dy = 0.0 if min_n <= TARGET_N <= max_n else min(abs(TARGET_N-min_n), abs(TARGET_N-max_n))
              return math.hypot(dx,dy), (min_e,min_n,max_e,max_n)

          rows = []
          sheet_min = {}
          building_count = 0
          with zipfile.ZipFile('/tmp/lod3.zip') as z:
              names = sorted(n for n in z.namelist() if n.lower().endswith(('.gml','.xml','.citygml')))
              for sheet in names:
                  root = ET.fromstring(z.read(sheet))
                  sheet_rows = []
                  for idx, building in enumerate(root.iter()):
                      if local(building.tag) not in {'Building','BuildingPart'}:
                          continue
                      building_count += 1
                      points = parse_points(building)
                      if not points:
                          continue
                      dist, bbox = bbox_distance(points)
                      bid = building.attrib.get(GML_ID) or f'{sheet}#{idx}'
                      row = (dist, sheet, bid, bbox, len(points))
                      rows.append(row)
                      sheet_rows.append(row)
                  if sheet_rows:
                      sheet_min[sheet] = min(sheet_rows)[0]

          rows.sort(key=lambda row: row[0])
          print('TARGET_E_N', TARGET_E, TARGET_N)
          print('GML_FILES', len(sheet_min))
          print('BUILDING_OR_PART_ELEMENTS', building_count)
          print('GEOMETRIES_SCANNED', len(rows))
          print('NEAREST_30_BUILDINGS')
          for row in rows[:30]:
              print(f'{row[0]:.3f}m\t{row[1]}\t{row[2]}\tbbox={row[3]}\tpoints={row[4]}')
          print('NEAREST_20_SHEETS_BY_ACTUAL_BUILDING')
          for sheet, dist in sorted(sheet_min.items(), key=lambda item: item[1])[:20]:
              print(f'{dist:.3f}m\t{sheet}')
          inside_170 = [row for row in rows if row[0] <= 170.0]
          inside_200 = [row for row in rows if row[0] <= 200.0]
          inside_250 = [row for row in rows if row[0] <= 250.0]
          print('COUNT_BBOX_WITHIN_170M', len(inside_170))
          print('COUNT_BBOX_WITHIN_200M', len(inside_200))
          print('COUNT_BBOX_WITHIN_250M', len(inside_250))
          if rows:
              print('GLOBAL_NEAREST_BUILDING_DISTANCE_M', f'{rows[0][0]:.3f}')
              print('GLOBAL_NEAREST_BUILDING_SHEET', rows[0][1])
              print('GLOBAL_NEAREST_BUILDING_ID', rows[0][2])
          else:
              raise SystemExit('No LoD3 building geometry parsed')
          PY
