name: Fix production C0 lighting snapshot

on:
  push:
    branches:
      - fix/production-spatial-smoke-day-night-20260911
    paths:
      - .github/fix-production-c0-lighting-snapshot.py
      - .github/workflows/fix-production-c0-lighting-snapshot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/production-spatial-smoke-day-night-20260911
          fetch-depth: 0
      - run: python3 .github/fix-production-c0-lighting-snapshot.py
      - run: node --check .github/production-spatial-c0-check.mjs
      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/production-spatial-c0-check.mjs
          git commit -m 'Make production C0 lighting proof resilient to canvas replacement'
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
