name: apply spatial dog like

on:
  push:
    branches:
      - feat/spatial-dog-like
    paths:
      - .github/workflows/apply-spatial-dog-like.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/spatial-dog-like

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply Dog-like patch
        run: python .github/apply-dog-like.py

      - name: Verify build
        run: |
          npm ci
          npm run build

      - name: Commit implementation and remove temporary patch files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AGENTS.md docs src .github/spatial-browser-check.mjs
          git rm .github/apply-dog-like.py .github/workflows/apply-spatial-dog-like.yml
          git commit -m 'Add Dog-like spatial candidate'
          git push origin HEAD:feat/spatial-dog-like
