name: apply R7 Bird image removal v2

on:
  push:
    branches:
      - feat/r7-remove-bird-image

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/r7-remove-bird-image
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Bird-like image removal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          def r(path, old, new):
              p=Path(path); t=p.read_text()
              if old not in t: raise SystemExit(f"missing {old[:80]!r} in {path}")
              p.write_text(t.replace(old,new,1))
          def s(path, pattern, repl, flags=0):
              p=Path(path); t=p.read_text(); ntext,n=re.subn(pattern,repl,t,count=1,flags=flags)
              if n!=1: raise SystemExit(f"regex {n} in {path}: {pattern}")
              p.write_text(ntext)
          s("src/modes.ts", r'\n  \{ key: "bird", label: "Bird-like", category: "Animal", confidence: "Estimated", note: "Bird-like visible-range approximation based on commonly described avian characteristics\. UV not included\." \},', "")
          r("src/transformEngine.ts", '  } else if (modeKey === "bird") {\n    saturateData(data, 0.08 + amount * 0.18);\n    boostMicroContrast(data, 0.02 + amount * 0.05);\n', "")
          s("src/transformEngine.ts", r'\nfunction saturateData\(data: Uint8ClampedArray, amount: number\) \{.*?\n\}\n', "\n", re.S)
          s("src/transformEngine.ts", r'\nfunction boostMicroContrast\(data: Uint8ClampedArray, amount: number\) \{.*?\n\}\n', "\n", re.S)
          s("src/modeEvidence.ts", r'\n  bird: \{.*?\n  \},\n  age: \{', "\n  age: {", re.S)
          r("README.md", "- Bird-like\n", "")
          r("docs/mvp-spec.md", "- Bird-like\n", "")
          s("docs/modes.md", r'\n### Bird-like\n.*?(?=\n## Reference modes)', "\n", re.S)
          r("docs/limitations.md", "Examples:\n- bird-like mode does not reproduce ultraviolet response or full avian perception;\n- dog and cat modes are simplified visible-range approximations.\n- Bee-like is not publicly rendered from ordinary RGB because ultraviolet/spectral scene information is absent.\n", "Examples:\n- dog and cat modes are simplified visible-range approximations.\n- Bird-like is not publicly rendered from ordinary RGB because a generic avian observer cannot be reconstructed from three camera channels.\n- Bee-like is not publicly rendered from ordinary RGB because ultraviolet/spectral scene information is absent.\n")
          r("docs/limitations.md", "A future avian spatial mode must be species-specific and/or use additional spectral/UV scene data with a documented observer model.\n", "The former Bird-like image mode was also removed during R7 because its saturation/microcontrast adjustment could not represent tetrachromacy, UVS/VS variation, oil-droplet filtering, species-specific acuity, or a defensible generic avian observer.\n\nA future avian image or spatial mode must be species-specific and/or use additional spectral/UV scene data with a documented observer model.\n")
          r("docs/roadmap.md", "- the only current image Bird-like behavior is a visible-range saturation/microcontrast proxy, which is not enough to justify a separate spatial mode.\n", "- the former image Bird-like behavior was only a visible-range saturation/microcontrast proxy; R7 removed it rather than preserve a generic avian claim that the RGB source cannot support.\n")
          r(".github/production-smoke.mjs", 'const expectedAnimalImageModes = ["dog", "cat", "bird"];', 'const expectedAnimalImageModes = ["dog", "cat"];')
          r(".github/production-smoke.mjs", 'result.notes.push(`current production behavior detected on attempt ${attempt}; Reference=Age only and Bee-like image mode absent`);', 'result.notes.push(`current production behavior detected on attempt ${attempt}; Reference=Age only and Bee-like/Bird-like image modes absent`);')
          r(".github/production-smoke.mjs", '  assert(!(await page.locator("body").innerText()).includes("Bee-like"), "desktop image: removed Bee-like image mode is still visible");\n', '  const animalBodyText = await page.locator("body").innerText();\n  assert(!animalBodyText.includes("Bee-like"), "desktop image: removed Bee-like image mode is still visible");\n  assert(!animalBodyText.includes("Bird-like"), "desktop image: removed Bird-like image mode is still visible");\n')
          PY
      - run: npm ci
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/asseenby-vite.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill $PREVIEW_PID || true' EXIT
          for i in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          cat > .github/r7-bird-check.mjs <<'JS'
          import { chromium } from "playwright";
          const BASE="http://127.0.0.1:4173";
          const spatial=["Normal","Tunnel Vision","Central Loss","Night / Low Light","Dog-like","Cataract-like"];
          const ok=(v,m)=>{if(!v)throw new Error(m)};
          const noOverflow=async(p,l)=>{const m=await p.evaluate(()=>({i:innerWidth,d:document.documentElement.scrollWidth,b:document.body.scrollWidth}));ok(m.d<=m.i+1&&m.b<=m.i+1,`${l} overflow ${JSON.stringify(m)}`)};
          const browser=await chromium.launch({headless:true});
          try{
            for(const viewport of [{width:1440,height:1000},{width:390,height:844}]){
              const c=await browser.newContext({viewport,isMobile:viewport.width===390,hasTouch:viewport.width===390});
              const p=await c.newPage(); const errors=[]; p.on("pageerror",e=>errors.push(String(e))); p.on("console",m=>{if(m.type()==="error")errors.push(m.text())});
              await p.goto(BASE,{waitUntil:"networkidle"}); await noOverflow(p,`image-${viewport.width}`);
              await p.locator("#category-select").selectOption("Animal");
              const values=await p.locator("#mode-select option").evaluateAll(ns=>ns.map(n=>n.value)); ok(JSON.stringify(values)===JSON.stringify(["dog","cat"]),`Animal ${JSON.stringify(values)}`);
              const body=await p.locator("body").innerText(); ok(!body.includes("Bee-like")&&!body.includes("Bird-like"),"removed animal mode visible");
              for(const mode of ["dog","cat"]){await p.locator("#mode-select").selectOption(mode); await p.waitForFunction(()=>document.querySelector('img[alt="Approximation"]')?.getAttribute("src")?.startsWith("blob:"));}
              await p.locator("#category-select").selectOption("Reference"); const refs=await p.locator("#mode-select option").evaluateAll(ns=>ns.map(n=>n.value)); ok(JSON.stringify(refs)===JSON.stringify(["age"]),`Reference ${JSON.stringify(refs)}`); ok(errors.length===0,errors.join(" | ")); await c.close();
            }
            for(const viewport of [{width:1440,height:1000},{width:390,height:844}]){
              const c=await browser.newContext({viewport,isMobile:viewport.width===390,hasTouch:viewport.width===390}); const p=await c.newPage(); const errors=[]; p.on("pageerror",e=>errors.push(String(e))); p.on("console",m=>{if(m.type()==="error")errors.push(m.text())});
              await p.goto(`${BASE}/?view=spatial`,{waitUntil:"networkidle"}); await p.locator("canvas.spatial-canvas").waitFor({timeout:30000}); await noOverflow(p,`spatial-${viewport.width}`); const labels=await p.getByRole("group",{name:"Spatial perception mode"}).getByRole("button").allTextContents(); ok(JSON.stringify(labels)===JSON.stringify(spatial),`Spatial ${JSON.stringify(labels)}`); ok(errors.length===0,errors.join(" | ")); await c.close();
            }
          }finally{await browser.close()}
          JS
          node .github/r7-bird-check.mjs
          rm .github/r7-bird-check.mjs
      - name: Commit clean implementation
        shell: bash
        run: |
          rm .github/workflows/apply-r7-bird-image.yml .github/workflows/apply-r7-bird-image-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/production-smoke.mjs README.md docs src .github/workflows
          git commit -m "Remove unsupported Bird-like image mode"
          git push origin HEAD:feat/r7-remove-bird-image
