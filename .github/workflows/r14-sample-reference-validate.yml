name: R14 sample dimension discovery

on:
  push:
    branches: [fix/r14-sample-blur-reference]
    paths: [.github/workflows/r14-sample-reference-validate.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r14-sample-blur-reference
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install browser runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/r14-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/r14-preview.log
          exit 1
      - name: Print intrinsic and transformed sample dimensions
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          const original = page.locator('img[alt="Original"]');
          await original.waitFor();
          const originalInfo = await original.evaluate((img) => ({ src: img.src.slice(0, 40), naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight }));

          await page.locator('#mode-select').selectOption('blur');
          const slider = page.locator('#strength-range');
          await slider.evaluate((el) => {
            const setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value')?.set;
            setter?.call(el, '100');
            el.dispatchEvent(new Event('input', { bubbles: true }));
            el.dispatchEvent(new Event('change', { bubbles: true }));
          });
          await page.waitForFunction(() => {
            const img = document.querySelector('img[alt="Approximation"]');
            return img instanceof HTMLImageElement && img.src.startsWith('blob:') && img.complete && img.naturalWidth > 0;
          }, null, { timeout: 15000 });
          const approximation = page.locator('img[alt="Approximation"]');
          const transformedInfo = await approximation.evaluate((img) => ({ src: img.src.slice(0, 40), naturalWidth: img.naturalWidth, naturalHeight: img.naturalHeight }));
          const result = { originalInfo, transformedInfo };
          console.log(JSON.stringify(result, null, 2));
          await browser.close();
          NODE
