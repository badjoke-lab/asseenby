name: production smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-smoke-main
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install temporary browser dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke
        env:
          ASSEENBY_PRODUCTION_URL: https://asseenby.pages.dev
        run: node .github/production-smoke.mjs

      - name: Upload production smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke
          path: production-smoke/
          if-no-files-found: warn
