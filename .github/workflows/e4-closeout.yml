name: E4 production closeout docs sync

on:
  push:
    branches:
      - docs/e4-production-closeout

permissions:
  contents: write

jobs:
  closeout:
    if: ${{ !contains(github.event.head_commit.message, 'Record E4 production closeout') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out closeout branch
        uses: actions/checkout@v4
        with:
          ref: docs/e4-production-closeout
          fetch-depth: 1

      - name: Patch closeout documentation
        run: python3 scripts/e4_closeout.py

      - name: Commit closeout documentation
        run: |
          git config user.name "badjoke-lab"
          git config user.email "badjoke.lab@gmail.com"
          git add docs/explore-3d-schedule.md docs/roadmap.md
          git diff --cached --check
          git commit -m "Record E4 production closeout"
          git push origin HEAD:docs/e4-production-closeout
