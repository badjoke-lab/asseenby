name: apply cat rejection record

on:
  push:
    branches:
      - feat/spatial-cat-like
    paths:
      - .github/workflows/apply-cat-rejection.yml
      - .github/apply-cat-rejection.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/spatial-cat-like

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply rejection record
        run: python .github/apply-cat-rejection.py

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

      - name: Commit rejection record and remove temporary files
        run: |
          rm -f .github/workflows/apply-cat-rejection.yml .github/apply-cat-rejection.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reject redundant Cat-like spatial candidate"
          git push origin HEAD:feat/spatial-cat-like
