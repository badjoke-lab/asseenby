name: R12 closeout docs

on:
  push:
    branches:
      - docs/r12-production-closeout
    paths:
      - .github/workflows/r12-closeout-docs.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/r12-production-closeout
      - name: Update R12 schedule state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/release-polish-schedule.md')
          s = p.read_text()
          s = s.replace(
              'Status: **Step R12 ACTIVE / resolution-normalized image blur components / R11 CVD model fidelity production verified**',
              'Status: **Step R12 PASS / resolution-normalized image blur production verified / R11 CVD model fidelity production verified**',
              1,
          )
          s = s.replace(
              '## Step R12 — Resolution-normalized image blur components\nStatus: **ACTIVE — implementation / validation**',
              '## Step R12 — Resolution-normalized image blur components\nStatus: **PASS / production verified**',
              1,
          )
          old = '''Acceptance:\n- same-content 350×225 and 1400×900 uploads produce comparable normalized outputs for every blur-bearing public image mode at Strength 40 and 100;\n- the built-in 1440×900 sample retains scale 1.0 and therefore preserves all pre-R12 configured blur endpoints;\n- Strength 0 identity and R11 CVD fidelity remain unchanged;\n- full desktop/390px image + spatial browser regression remains green;\n- matching main build and production smoke pass after merge before R12 is marked production verified.\n\n## Current next action\nRun a controlled same-content resolution audit for Blur / Tunnel / Central Loss / Cataract-like / Dog-like at 350×225 versus 1400×900, then run the full image/spatial browser regression. Open a clean PR only if both gates pass.'''
          new = '''Acceptance:\n- same-content 350×225 and 1400×900 uploads produce comparable normalized outputs for every blur-bearing public image mode at Strength 40 and 100 — **PASS**;\n- the built-in 1440×900 sample retains scale 1.0 and therefore preserves all pre-R12 configured blur endpoints — **PASS**;\n- Strength 0 identity and R11 CVD fidelity remain unchanged — **PASS**;\n- full desktop/390px image + spatial browser regression remains green — **PASS**;\n- matching main build and production smoke pass after merge before R12 is marked production verified — **PASS**.\n\nValidation:\n- before/after resolution validation v2 `34067641403` — **success**; across Blur / Tunnel Vision / Central Loss / Cataract-like / Dog-like at Strength 40/100, aggregate same-content cross-resolution mean channel error fell from **13.668 to 1.857** (~86.4% reduction);\n- representative v2 endpoints: Blur 100 **43.578 -> 0.884**, Tunnel Vision 100 **17.847 -> 1.608**, Cataract-like 100 **17.461 -> 1.700**;\n- the same validation run completed full desktop/390px image + spatial regression — **success**;\n- PR #33 build `34067889815` — **success**;\n- PR #33 squash-merged as `f3b28c150ea44134135dc37420197721022bd3a7`;\n- matching main build `34067915020` — **success**;\n- production smoke `34067914996` — **success**; production artifact `9999544384`;\n- dedicated production-resolution audit `34067960352` — **success on attempt 1**; live `https://asseenby.pages.dev/` Blur 100 on same-content 350×225 vs 1400×900 measured mean channel error **0.844** against a release gate of `<=3`, directly distinguishing the deployed R12 renderer from the pre-R12 behavior (~43.578);\n- dedicated production audit artifact `9999560170` — **success / retained evidence**.\n\n## Step R12 closeout\nStatus: **PASS / production verified**\n\nR12 is closed. The remaining public image blur-bearing renderers now normalize pixel blur radii against the processed image short edge while preserving the 1440×900 built-in sample endpoints, and the behavior is verified both in local before/after A/B browser output and on the public production deployment.\n\nDo not reopen R12 merely for further tuning. Reopen image-transform work only for a new concrete renderer/model/output defect found by evidence review or controlled output audit.'''
          if old not in s:
              raise SystemExit('R12 closeout anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit closeout
        shell: bash
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add docs/release-polish-schedule.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No closeout change'; exit 1; }
          git commit -m "Record R12 production closeout"
          git push origin HEAD:docs/r12-production-closeout
