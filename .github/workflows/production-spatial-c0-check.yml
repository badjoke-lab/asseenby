name: production spatial C0 check

on:
  push:
    branches:
      - feat/blender-c0-visible-core-20260908
    paths:
      - .github/production-spatial-c0-check.mjs
      - .github/workflows/production-spatial-c0-check.yml
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verification branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install temporary browser dependency
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify authored C0 on production
        env:
          ASSEENBY_PRODUCTION_URL: https://asseenby.pages.dev
        run: node .github/production-spatial-c0-check.mjs

      - name: Upload production C0 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-spatial-c0
          path: production-spatial-c0/
          if-no-files-found: warn
