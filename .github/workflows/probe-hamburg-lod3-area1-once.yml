name: Probe Hamburg LoD3 Area1 once

on:
  push:
    branches:
      - feat/hamburg-hansaplatz-lod3-20260909
    paths:
      - .github/workflows/probe-hamburg-lod3-area1-once.yml

permissions:
  contents: write

concurrency:
  group: probe-hamburg-lod3-area1-once
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/hamburg-hansaplatz-lod3-20260909
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends unzip python3-pyproj

      - name: Download official Hamburg LoD3 Area1 archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 \
            --output /tmp/hamburg-lod3-area1.zip \
            https://archiv.transparenz.hamburg.de/hmbtgarchive/HMDK/lod3-hh_area1_2023_12_14_180710_snap_1.zip
          test -s /tmp/hamburg-lod3-area1.zip
          du -h /tmp/hamburg-lod3-area1.zip
          unzip -tq /tmp/hamburg-lod3-area1.zip

      - name: Resolve Hansaplatz tile candidates
        run: |
          set -euo pipefail
          mkdir -p scripts/hamburg
          python3 - <<'PY' > /tmp/utm.txt
          from pyproj import Transformer
          lon, lat = 10.012056, 53.554451
          x, y = Transformer.from_crs(4326, 25832, always_xy=True).transform(lon, lat)
          print(f"GPS: {lat:.6f}, {lon:.6f}")
          print(f"EPSG:25832: E={x:.3f} N={y:.3f}")
          print(f"1km tile index: E={int(x)//1000} N={int(y)//1000}")
          PY
          unzip -Z1 /tmp/hamburg-lod3-area1.zip > /tmp/archive-list.txt
          {
            echo '# Hamburg LoD3 Area1 archive probe'
            echo
            cat /tmp/utm.txt
            echo
            echo 'Archive entry count:'
            wc -l < /tmp/archive-list.txt
            echo
            echo 'Entries matching Hansaplatz 1km indices (567 / 5934) or immediate neighbors:'
            grep -Ei '(566|567|568).*(5933|5934|5935)|(5933|5934|5935).*(566|567|568)' /tmp/archive-list.txt || true
            echo
            echo 'Nearby CityGML/GML candidates:'
            grep -Ei '\.(gml|xml|citygml)$' /tmp/archive-list.txt | grep -Ei '(566|567|568|5933|5934|5935)' | head -n 400 || true
            echo
            echo 'Texture/image entries near matching directory names:'
            grep -Ei '\.(jpg|jpeg|png|tif|tiff)$' /tmp/archive-list.txt | grep -Ei '(566|567|568|5933|5934|5935)' | head -n 800 || true
            echo
            echo 'Archive first 120 entries:'
            head -n 120 /tmp/archive-list.txt
          } > scripts/hamburg/HANSAPLATZ_LOD3_ARCHIVE_PROBE.txt
          cat scripts/hamburg/HANSAPLATZ_LOD3_ARCHIVE_PROBE.txt

      - name: Commit probe and remove bootstrap
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/hamburg/HANSAPLATZ_LOD3_ARCHIVE_PROBE.txt
          git rm .github/workflows/probe-hamburg-lod3-area1-once.yml
          git commit -m 'Record Hamburg LoD3 Hansaplatz archive tile probe'
          git fetch origin feat/hamburg-hansaplatz-lod3-20260909
          git rebase origin/feat/hamburg-hansaplatz-lod3-20260909
          git push origin HEAD:feat/hamburg-hansaplatz-lod3-20260909
