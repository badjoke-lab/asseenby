name: E4 Human spatial Vision validation

on:
  push:
    branches:
      - feat/e4-human-spatial-vision

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, 'Apply E4 validated product changes') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out E4 branch
        uses: actions/checkout@v4
        with:
          ref: feat/e4-human-spatial-vision
          fetch-depth: 1

      - name: Apply E4 implementation
        run: |
          python3 scripts/e4_patch.py
          python3 scripts/e4_smoke_patch.py
          python3 scripts/e4_validate_fix.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install temporary browser validation dependencies
        run: npm install --no-save --package-lock=false playwright@1.55.0 pngjs@7.0.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local production preview
        run: |
          npm run preview -- --host 127.0.0.1 >/tmp/e4-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/e4-preview.log
          exit 1

      - name: Validate E4 geometry Vision behavior
        env:
          ASSEENBY_PRODUCTION_URL: http://127.0.0.1:4173
        run: node scripts/e4_validate.mjs

      - name: Run full local production smoke with E4 fingerprint
        env:
          ASSEENBY_PRODUCTION_URL: http://127.0.0.1:4173
        run: node .github/production-smoke.mjs

      - name: Commit validated E4 product changes
        run: |
          git config user.name "badjoke-lab"
          git config user.email "badjoke.lab@gmail.com"
          git add \
            .github/production-smoke.mjs \
            docs/explore-3d-schedule.md \
            docs/limitations.md \
            docs/methodology.md \
            docs/modes.md \
            docs/roadmap.md \
            docs/ui-spec.md \
            src/SpatialPage.tsx \
            src/spatialEvidence.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No validated E4 product changes to commit"
            exit 1
          fi
          git commit -m "Apply E4 validated product changes"
          git push origin HEAD:feat/e4-human-spatial-vision

      - name: Upload E4 validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e4-human-spatial-vision-validation
          path: |
            e4-validation/
            production-smoke/
          if-no-files-found: warn
