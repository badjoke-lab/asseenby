name: apply bird evaluation

on:
  push:
    branches:
      - feat/spatial-bird-evaluation
    paths:
      - .github/workflows/apply-bird-evaluation.yml
      - .github/apply-bird-evaluation.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/spatial-bird-evaluation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply Bird-like evidence evaluation
        run: python .github/apply-bird-evaluation.py

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: npm run build

      - name: Commit evaluation and remove temporary files
        run: |
          rm -f .github/workflows/apply-bird-evaluation.yml .github/apply-bird-evaluation.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reject generic Bird-like spatial mode"
          git push origin HEAD:feat/spatial-bird-evaluation
