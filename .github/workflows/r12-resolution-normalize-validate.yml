name: R12 resolution-normalized blur validation

on:
  push:
    branches:
      - fix/r12-resolution-normalized-blur
    paths:
      - .github/workflows/r12-resolution-normalize-validate.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/r12-resolution-normalized-blur
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply R12 product patch
        run: python3 scripts/r12_patch.py

      - name: Build
        run: npm run build

      - name: Install browser validation runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Validate cross-resolution transform consistency
        shell: bash
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 > /tmp/r12-audit-preview.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.5
          done
          ASSEENBY_AUDIT_URL=http://127.0.0.1:4173 node scripts/r12_resolution_audit.mjs

      - name: Run full local browser regression
        shell: bash
        env:
          ASSEENBY_PRODUCTION_URL: http://127.0.0.1:4173
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 > /tmp/r12-smoke-preview.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.5
          done
          node .github/production-smoke.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r12-resolution-normalization-validation
          path: |
            r12-resolution-audit.json
            production-smoke/
          if-no-files-found: warn

      - name: Commit validated R12 product changes
        run: |
          git config user.name badjoke-lab
          git config user.email badjoke.lab@gmail.com
          git add src/transformEngine.ts docs/methodology.md docs/limitations.md docs/release-polish-schedule.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No R12 product changes to commit'; exit 1; }
          git commit -m "Normalize image blur effects across source resolutions"
          git push origin HEAD:fix/r12-resolution-normalized-blur
