name: R8 hero product validate

on:
  push:
    branches:
      - feat/r8-hero-current-scope

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Run R8-4 product validation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/r8-hero-current-scope
          fetch-depth: 0
      - name: Apply product patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app_path = Path('src/App.tsx')
          app = app_path.read_text()
          old = 'AsSeenBy is a research-based comparison viewer that translates commonly described visual differences into image-based approximations across human conditions, animal-inspired modes, and reference profiles.'
          new = 'AsSeenBy is a research-based comparison viewer that translates commonly described visual differences into image-based approximations across human visual conditions and animal-inspired modes.'
          if old not in app:
              raise SystemExit('hero sentence not found')
          app_path.write_text(app.replace(old, new, 1))
          smoke_path = Path('.github/production-smoke.mjs')
          smoke = smoke_path.read_text()
          needle = '  const pageText = await page.locator("body").innerText();'
          extra = '\n'.join([
              needle,
              '  const heroText = await page.locator(".hero-copy").innerText();',
              '  assert(heroText.includes("human visual conditions") && heroText.includes("animal-inspired modes"), "desktop image: hero does not describe the current Human/Animal product scope");',
              '  assert(!heroText.includes("reference profiles"), "desktop image: removed Reference scope is still advertised in the hero");',
          ])
          if needle not in smoke:
              raise SystemExit('smoke anchor not found')
          smoke_path.write_text(smoke.replace(needle, extra, 1))
          PY
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run full local browser smoke
        shell: bash
        run: |
          ./node_modules/.bin/vite preview --host 127.0.0.1 > /tmp/asseenby-r8-4-preview.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.5
          done
          ASSEENBY_PRODUCTION_URL=http://127.0.0.1:4173 node .github/production-smoke.mjs
      - name: Commit validated product changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx .github/production-smoke.mjs
          git commit -m 'Align hero with current public scope'
          git push
      - name: Upload browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-hero-product-smoke
          path: production-smoke
